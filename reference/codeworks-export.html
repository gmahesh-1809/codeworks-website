w-chev{display:inline-grid;place-items:center;width:32px;height:42px;padding:0 8px 0 2px;background:none;border:0;color:inherit;cursor:pointer;border-radius:0 99px 99px 0;box-sizing:border-box}\n.cw-chev svg{transition:transform .2s}\n.cw-chev.open svg{transform:rotate(180deg)}\n.cw-dd{position:relative}\n.cw-menu-wrap{position:absolute;top:100%;padding-top:10px;z-index:60}\n.cw-menu{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:0 26px 50px -18px rgba(13,42,58,.32),0 2px 6px rgba(13,42,58,.06);animation:cw-pop .18s ease-out;transform-origin:top left}\n.cw-mi{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:500;transition:background-color .15s,color .15s}\n.cw-mi:hover{background:var(--hover);color:var(--ink)}\n.cw-mi.on{background:var(--tint-blue)}\n.cw-mi .arr{margin-left:auto;color:var(--ink-4);transition:transform .2s,color .2s}\n.cw-mi:hover .arr{color:var(--blue-ink);transform:translateX(4px)}\n.cw-sw{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#fff;font:800 18px 'Bricolage Grotesque',sans-serif}\n.cw-mt{display:flex;flex-direction:column;gap:2px;min-width:0}\n.cw-mt b{font-size:15.5px;font-weight:700}\n.cw-mt small{font-size:13.5px;color:var(--ink-2);line-height:1.35;white-space:normal;font-weight:400}\n.cw-mi-all{margin-top:6px;padding-top:14px;border-top:1px solid var(--line-2);border-radius:0 0 14px 14px}\n.cw-burger{margin-left:auto;width:46px;height:46px;border-radius:50%;border:1px solid var(--line-3);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:border-color .2s,color .2s}\n.cw-burger:hover{border-color:var(--cw-blue);color:var(--blue-text)}\n.cw-mnav a.cw-ml{display:flex;align-items:center;min-height:44px;border-bottom:1px solid var(--line-2);color:var(--ink);text-decoration:none}\n.cw-mnav a.cw-ml:hover{color:var(--cw-blue-700)}\n\n/* home hero: app window */\n.cw-stage{position:relative;padding:0 0 30px}\n.cw-glow{position:absolute;inset:-56px -40px -20px -48px;background:linear-gradient(120deg,rgba(24,120,164,.2),rgba(92,144,60,.18));-webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);z-index:0;pointer-events:none}\n.cw-back{position:absolute;left:18px;right:-18px;top:18px;bottom:48px;border-radius:22px;background:var(--back);border:1px solid var(--line);z-index:0}\n.cw-win{padding-bottom:34px;position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 1px 0 rgba(13,42,58,.03),0 34px 60px -24px rgba(13,42,58,.32),0 12px 24px -12px rgba(13,42,58,.12)}\n.cw-bar{display:flex;align-items:center;gap:14px;padding:13px 18px;background:var(--surface-2);border-bottom:1px solid var(--line-2)}\n.cw-dots{display:flex;gap:7px;flex:none}\n.cw-dots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}\n.cw-wt{font-size:13px;font-weight:500;color:var(--ink-2);min-width:0}\n.cw-seg{display:flex;gap:5px;padding:18px 22px 6px}\n.cw-seg i{flex:1;height:5px;border-radius:5px;background:var(--line)}\n.cw-seg i.done{background:var(--cw-green-600)}.cw-seg i.run{background:var(--cw-blue)}.cw-seg i.ready{background:var(--cw-green)}\n.cw-steps{padding:4px 22px 6px}\n.cw-step{position:relative;display:flex;align-items:center;gap:14px;padding:9px 0;font-size:16px;font-weight:500}\n.cw-step:not(:last-child)::after{content:\"\";position:absolute;left:15px;top:calc(100% - 9px);height:18px;width:2px;background:var(--line-2)}\n.cw-step>span:nth-child(2){flex:1;min-width:0}\n.cw-node{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:700;border:1.5px solid var(--line-3);color:var(--ink-4);background:var(--surface);box-sizing:border-box}\n.cw-node.done{background:var(--cw-green-600);border-color:var(--cw-green-600);color:#fff}\n.cw-node.run{border-color:var(--cw-blue);color:var(--cw-blue-700);background:var(--tint-blue)}\n.cw-node.ready{border-color:var(--cw-green-600);color:var(--cw-green-700);background:var(--tint-green)}\n.cw-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:none;white-space:nowrap}\n.cw-pill i{width:7px;height:7px;border-radius:50%;background:currentColor}\n.cw-pill.done,.cw-pill.ready{background:var(--tint-green);color:var(--green-text)}\n.cw-pill.run{background:var(--tint-blue);color:var(--blue-text)}\n.cw-pill.run i{background:var(--cw-blue);animation:cw-pulse 1.6s ease-out infinite}\n.cw-pill.queue{background:var(--hover);color:var(--ink-4)}\n.cw-risks{margin:8px 14px 14px;padding:8px;border-radius:16px;background:var(--surface-3);display:grid;gap:6px}\n.cw-risk{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 14px}\n.cw-tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;flex:none}\n.cw-float{position:absolute;left:-40px;bottom:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;width:min(390px,100%);box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 16px;font-size:14.5px;box-shadow:0 22px 40px -16px rgba(13,42,58,.38),0 4px 10px rgba(13,42,58,.06)}\n@media (max-width:1180px){.cw-win{padding-bottom:0}.cw-float{position:relative;left:0;margin-top:12px;width:100%}.cw-back{display:none}.cw-stage{padding-bottom:0}}\n\n/* home product tiles + trust row */\n.cw-prod{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min n;justify-content:space-between;gap:48px;min-height:300px\">\n    \u003cdiv>\u003ch1 style=\"margin:0;font:700 clamp(48px,6.4vw,92px)/.98 'Bricolage Grotesque';letter-spacing:-0.045em\">Spectra\u003c/h1>\u003cp style=\"margin:20px 0 0;font-size:clamp(18px,1.7vw,22px);line-height:1.4;max-width:30ch;font-weight:400\">Subvention Processing Engine for Claims Tracing, Reconciliation and Audit\u003c/p>\u003c/div>\n    \u003cdiv>\u003ca class=\"cw-btn cw-btn-inverse cw-btn-lg\" href=\"Codeworks%20Contact.dc.html\">Talk to Us \u003cspan class=\"arr\">→\u003c/span>\u003c/a>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"cw-pwin\">\n    \u003cdiv class=\"cw-win\">\n      \u003cdiv class=\"cw-bar\">\u003cspan class=\"cw-dots\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"cw-wt\">Key Highlights\u003c/span>\u003c/div>\n      \u003cdiv class=\"cw-hl\">\u003csc-for list=\"{{ highlights }}\" as=\"h\" hint-placeholder-count=\"4\">\u003cdiv class=\"cw-hl-row\">\u003cspan class=\"cw-ck\" style=\"background:#4d8230\">\u003csvg width=\"13\" height=\"13\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 7.5l3 3 6-6.5\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan>{{ h }}\u003c/span>\u003c/div>\u003c/sc-for>\u003c/div>\n      \u003cdiv class=\"cw-roi\" style=\"background:var(--roi-green);color:var(--green-text)\">\u003cdiv class=\"k\">ROI Impact\u003c/div>\u003cdiv class=\"v\">Eliminates audit leaks and manual settlement delays.\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection style=\"margin-top:56px;padding:0 clamp(8px,2.5vw,32px) 44px\">\n  \u003cdiv role=\"tablist\" class=\"cw-ptabs\" style=\"display:inline-flex;flex-wrap:wrap;gap:6px;background:var(--tab-bg);border-radius:99px;padding:6px\">\n    \u003cbutton role=\"tab\" class=\"cw-tab\" id=\"tab-overview\" aria-selected=\"{{ sel_overview }}\" tabindex=\"{{ ti_overview }}\" onKeyDown=\"{{ tabKey }}\" onClick=\"{{ showOverview }}\" style=\"cursor:pointer;border:0;min-height:44px;padding:0 24px;border-radius:99px;font:700 15px 'DM Sans';background:{{ ovBg }};color:{{ ovFg }}\">Overview\u003c/button>\n    \u003cbutton role=\"tab\" class=\"cw-tab\" id=\"tab-capabilities\" aria-selected=\"{{ sel_capabilities }}\" tabindex=\"{{ ti_capabilities }}\" onKeyDown=\"{{ tabKey }}\" onClick=\"{{ showCaps }}\" style=\"cursor:pointer;border:0;min-height:44px;padding:0 24px;border-radius:99px;font:700 15px 'DM Sans';background:{{ cpBg }};color:{{ cpFg }}\">Capabilities\u003c/button>\n  \u003c/div>\n\n  \u003csc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n    \u003cdiv role=\"tabpanel\" id=\"cw-panel\" aria-labelledby=\"tab-overview\" class=\"cw-split\" style=\"margin-top:40px\">\n      \u003cdiv style=\"font-size:18px;line-height:1.7;color:var(--ink-3);max-width:68ch\">\n        \u003cspan class=\"cw-bar-accent\" style=\"background:#5c903c\">\u003c/span>\u003ch3 style=\"margin:0 0 14px;font:800 clamp(26px,2.8vw,34px)/1.05 'Bricolage Grotesque';letter-spacing:-0.03em;color:var(--ink)\">Complete Subvention Processing\u003c/h3>\n        \u003cp style=\"margin:0 0 20px\">Spectra automates the end-to-end processing of subvention claims—from scheme eligibility and claim tracing to rule-based calculation, reconciliation, nodal agency submission, settlement processing and credit release reporting.\u003c/p>\n        \u003cp style=\"margin:0\">Its configurable business rule engine and workflow framework manage scheme-specific eligibility, calculations, validations, claim batching, multi-source reconciliation and exceptions with complete transaction-level traceability.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"cw-rcol\" style=\"font-size:18px;line-height:1.7;color:var(--ink-3)\">\n        \u003cspan class=\"cw-bar-accent\" style=\"background:#5c903c\">\u003c/span>\n        \u003ch3 style=\"margin:0 0 14px;font:800 clamp(26px,2.8vw,34px)/1.05 'Bricolage Grotesque';letter-spacing:-0.03em;color:var(--ink)\">Built for Scale and Change\u003c/h3>\n        \u003cp style=\"margin:0 0 20px\">Spectra is scalable and configurable, allowing institutions to accommodate multiple schemes, changing eligibility criteria, business rules, calculation methodologies and operational workflows without redesigning the processing engine.\u003c/p>\n        \u003cp class=\"cw-close\">Spectra brings \u003cem>scheme rules\u003c/em>, \u003cem>claims\u003c/em>, \u003cem>calculations\u003c/em>, \u003cem>reconciliation\u003c/em>, \u003cem>audit\u003c/em>, \u003cem>submission\u003c/em>, \u003cem>settlement\u003c/em> and \u003cem>traceability\u003c/em> into one controlled subvention processing platform.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/sc-if>\n\n  \u003csc-if value=\"{{ isCaps }}\" hint-placeholder-val=\"{{ false }}\">\n    \u003cdiv role=\"tabpanel\" id=\"cw-panel\" aria-labelledby=\"tab-capabilities\" class=\"cw-opengrid\" style=\"margin-top:40px\">\n      \u003csc-for list=\"{{ caps }}\" as=\"c\" hint-placeholder-count=\"9\">\u003cdiv class=\"cw-open cw-rv acc-green\">\u003cb class=\"k\">{{ c.num }}\u003c/b>\u003cdiv>\u003cdiv class=\"t\">{{ c.title }}\u003c/div>\u003cdiv class=\"d\">{{ c.desc }}\u003c/div>\u003c/div>\u003c/div>\u003c/sc-for>\n    \u003c/div>\n  \u003c/sc-if>\n\u003c/section>\n\n\u003csection class=\"cw-viz cw-bleed cw-viz-green\" role=\"img\" aria-label=\"Illustration of the product workflow\">\n \u003cdiv class=\"cw-viz-in cw-rv\">\u003cdiv class=\"cw-vwin\">\u003cdiv class=\"cw-bar\">\u003cspan class=\"cw-dots\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003c/div>\u003cdiv class=\"cw-vrow\">\u003cdiv class=\"cw-vst \">\u003cdiv class=\"cw-vh\">\u003ci class=\"n\" aria-hidden=\"true\">\u003c/i>\u003cb>Automated claim tracing &amp; validation\u003c/b>\u003c/div>\u003cdiv class=\"cw-vb\">\u003cdiv class=\"vrow\">\u003cem class=\"dot ok\">\u003c/em>\u003cspan class=\"ln w46 \">\u003c/span>\u003cspan class=\"ln w24 \">\u003c/span>\u003c/div>\u003cdiv class=\"vrow\">\u003cem class=\"dot ok\">\u003c/em>\u003cspan class=\"ln w46 \">\u003c/span>\u003cspan class=\"ln w24 \">\u003c/span>\u003c/div>\u003cdiv class=\"vrow\">\u003cem class=\"dot ok\">\u003c/em>\u003cspan class=\"ln w46 \">\u003c/span>\u003cspan class=\"ln w24 \">\u003c/span>\u003c/div>\u003cdiv class=\"vrow\">\u003cem class=\"dot warn\">\u003c/em>\u003cspan class=\"ln w46 \">\u003c/span>\u003cspan class=\"ln w24 \">\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"cw-vst \">\u003cdiv class=\"cw-vh\">\u003ci class=\"n\" aria-hidden=\"true\">\u003c/i>\u003cb>Rule-based calculation engines\u003c/b>\u003c/div>\u003cdiv class=\"cw-vb\">\u003cdiv class=\"vcalc\">\u003cspan class=\"ln w26 \">\u003c/span>\u003cb>×\u003c/b>\u003cspan class=\"ln w18 \">\u003c/span>\u003cb>=\u003c/b>\u003ci class=\"chip\">\u003c/i>\u003c/div>\u003cdiv class=\"vcalc\">\u003cspan class=\"ln w26 \">\u003c/span>\u003cb>×\u003c/b>\u003cspan class=\"ln w18 \">\u003c/span>\u003cb>=\u003c/b>\u003ci class=\"chip\">\u003c/i>\u003c/div>\u003cdiv class=\"vcalc\">\u003cspan class=\"ln w26 \">\u003c/span>\u003cb>×\u003c/b>\u003cspan class=\"ln w18 \">\u003c/span>\u003cb>=\u003c/b>\u003ci class=\"chip\">\u003c/i>\u003c/div>\u003cdiv class=\"vsum\">\u003cspan class=\"ln w30 \">\u003c/span>\u003ci class=\"chip big\">\u003c/i>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"cw-vst \">\u003cdiv class=\"cw-vh\">\u003ci class=\"n\" aria-hidden=\"true\">\u003c/i>\u003cb>Complete transaction traceability\u003c/b>\u003c/div>\u003cdiv class=\"cw-vb\">\u003cdiv class=\"vtl\">\u003cdiv class=\"tl\">\u003ci>\u003c/i>\u003cspan class=\"col\">\u003cspan class=\"ln w64 \">\u003c/span>\u003cspan class=\"ln w38 \">\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"tl\">\u003ci>\u003c/i>\u003cspan class=\"col\">\u003cspan class=\"ln w64 \">\u003c/span>\u003cspan class=\"ln w38 \">\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"tl\">\u003ci>\u003c/i>\u003cspan class=\"col\">\u003cspan class=\"ln w64 \">\u003c/span>\u003cspan class=\"ln w38 \">\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"cw-vst \">\u003cdiv class=\"cw-vh\">\u003ci class=\"n\" aria-hidden=\"true\">\u003c/i>\u003cb>Automated multi-party reconciliation\u003c/b>\u003c/div>\u003cdiv class=\"cw-vb\">\u003csvg class=\"vgraph rec\" viewBox=\"0 0 220 120\" aria-hidden=\"true\">\u003cg class=\"l\">\u003crect x=\"10\" y=\"12\" width=\"66\" height=\"14\" rx=\"7\"/>\u003crect x=\"10\" y=\"42\" width=\"66\" height=\"14\" rx=\"7\"/>\u003crect x=\"10\" y=\"72\" width=\"66\" height=\"14\" rx=\"7\"/>\u003crect x=\"10\" y=\"102\" width=\"66\" height=\"14\" rx=\"7\"/>\u003c/g>\u003cg class=\"l r\">\u003crect x=\"144\" y=\"12\" width=\"66\" height=\"14\" rx=\"7\"/>\u003crect x=\"144\" y=\"42\" width=\"66\" height=\"14\" rx=\"7\"/>\u003crect x=\"144\" y=\"72\" width=\"66\" height=\"14\" rx=\"7\"/>\u003c/g>\u003cg class=\"flowline\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\u003cpath d=\"M76 19 L144 19\"/>\u003cpath d=\"M76 49 L144 49\"/>\u003cpath d=\"M76 79 L144 79\"/>\u003c/g>\u003cpath d=\"M76 109 L110 109\" stroke=\"var(--amber)\" stroke-width=\"1.6\" stroke-dasharray=\"3 4\" fill=\"none\"/>\u003c/svg>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"cw-vprog\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection style=\"margin-top:64px;display:flex;flex-wrap:wrap;gap:12px\">\n  \u003ca class=\"cw-tile cw-tile-green\" href=\"Codeworks%20Contact.dc.html\">Talk to Us\u003cspan class=\"arr\">→\u003c/span>\u003c/a>\n  \u003ca class=\"cw-tile cw-tile-out to-blue\" href=\"Drishti%20Product.dc.html\">Next: Drishti.ai\u003cspan class=\"arr\">→\u003c/span>\u003c/a>\n\u003c/section>\n\u003cdc-import name=\"CW Footer\" hint-size=\"100%,64px\">\u003c/dc-import>\n\u003c/div>\n\u003c/div>\n\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script>\nclass Component extends DCLogic {\n  state = { tab: 'overview' };\n  CAPS = [\n    ['Scheme Eligibility & Rules', 'Configure scheme-specific eligibility criteria, business rules, parameters and workflows.'],\n    ['Claim Tracing & Validation', 'Trace eligible claims across source systems, validate supporting data and identify exceptions.'],\n    ['Rule-Based Calculation', 'Apply 100% rule-based calculations consistently across high-volume claim populations, with every calculation traceable to the applicable scheme rules and parameters.'],\n    ['Claim Batching & Nodal Agency Submission', 'Generate validated claim batches and prepare them for submission to the relevant nodal agencies.'],\n    ['Audit & Certification Support', 'Generate comprehensive claim audit reports and supporting documentation for independent audit and certification by Big 4 audit firms, enabling the claim batch to be reviewed and certified before submission to the nodal agency.'],\n    ['Reconciliation', 'Reconcile claims, transactions and nodal agency responses across multiple data sources, identifying mismatches, adjustments and unresolved exceptions.'],\n    ['Settlement Processing', 'Establish the reconciled settlement position with a complete record of claims, calculations, adjustments and reconciliation outcomes.'],\n    ['Credit Release Reporting', 'Generate credit release reports from validated and reconciled settlement data for downstream processing. Spectra does not execute the actual credit release to the borrower or financial institution.'],\n    ['Traceability & Audit', 'Maintain an end-to-end, transaction-level trail across eligibility, rules, calculations, claims, validations, submissions, reconciliations, exceptions and settlement outcomes, providing the evidence required for audit, certification and operational review.']\n  ];\n  componentDidMount() { this._h = () => { const k = (location.hash || '').replace('#', ''); if (k === 'capabilities' || k === 'overview') this.setState({ tab: k }); }; this._h(); window.addEventListener('hashchange', this._h); }\n  componentWillUnmount() { window.removeEventListener('hashchange', this._h); }\n  renderVals() {\n    const o = this.state.tab !== 'capabilities';\n    return {\n      isOverview: o, isCaps: !o, sel_overview: String(o), sel_capabilities: String(!o), ti_overview: o ? 0 : -1, ti_capabilities: o ? -1 : 0,\n      tabKey: e => { const O = ['overview', 'capabilities'], k = e && e.key, i = Math.max(0, O.indexOf(this.state.tab)); let n = null; if (k === 'ArrowRight') n = O[(i + 1) % O.length]; else if (k === 'ArrowLeft') n = O[(i + O.length - 1) % O.length]; else if (k === 'Home') n = O[0]; else if (k === 'End') n = O[O.length - 1]; if (!n) return; e.preventDefault(); this.setState({ tab: n }); try { history.replaceState(null, '', '#' + n); } catch (x) {} setTimeout(() => { const el = document.getElementById('tab-' + n); if (el) el.focus(); }, 30); },\n      ovBg: o ? 'var(--ink-fill)' : 'transparent', ovFg: o ? 'var(--ink-fill-text)' : 'var(--ink-3)', cpBg: !o ? 'var(--ink-fill)' : 'transparent', cpFg: !o ? 'var(--ink-fill-text)' : 'var(--ink-3)',\n      showOverview: () => { this.setState({ tab: 'overview' }); try { history.replaceState(null, '', '#overview'); } catch (e) {} },\n      showCaps: () => { this.setState({ tab: 'capabilities' }); try { history.replaceState(null, '', '#capabilities'); } catch (e) {} },\n      highlights: ['Automated claim tracing & validation', 'Rule-based calculation engines', 'Complete transaction traceability', 'Automated multi-party reconciliation'],\n      caps: this.CAPS.map((c, i) => ({ num: String(i + 1).padStart(2, '0'), title: c[0], desc: c[1] }))\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Codeworks Technology.dc.html":"\u003c!DOCTYPE html>\n\u003chtml>\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>body{margin:0;background:var(--bg)}:focus-visible{outline:2px solid #1878a4;outline-offset:2px}a{color:var(--blue-text)}a:hover{color:var(--blue-ink)}\n:root{color-scheme:light;--cw-blue:#1878a4;--cw-blue-600:#125f82;--cw-blue-700:#0b4a66;--cw-green:#5c903c;--cw-green-600:#4d8230;--cw-green-700:#3d6522;\n--bg:#f1f6f8;--surface:#ffffff;--surface-2:#f5f9fb;--surface-3:#f3f8fa;--hover:#eef4f7;\n--ink:#0d1f28;--ink-2:#485c65;--ink-3:#33474f;--ink-4:#5a6d76;\n--line:#d4e1e7;--line-2:#e3ecf0;--line-3:#c3d6df;--line-4:#b9c8cf;\n--blue-text:#0b5577;--blue-ink:#1878a4;--green-text:#3d6522;\n--tint-blue:#e0eef5;--tint-green:#e3eed9;--tint-band:#e7f0f4;--tab-bg:#e2ebf0;--input:#f7fafb;\n--ink-fill:#0d1f28;--ink-fill-text:#ffffff;--ink-fill-hover:#1c3541;\n--deep:#0d1f28;--deep-2:#152f3b;\n--warn-bg:#f6dfa8;--warn-fg:#5c3f00;--flag-bg:#f3c4bc;--flag-fg:#7a1f12;--ok-bg:#cfe5bd;--ok-fg:#2f5219;--roi-blue:#e0eef5;--roi-green:#e6f0dc;\n--glass:rgba(255,255,255,.8);--glass-2:rgba(255,255,255,.93);--glass-line:rgba(207,221,228,.9);--back:rgba(255,255,255,.55);}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){color-scheme:dark;\n--bg:#09151b;--surface:#111f27;--surface-2:#15262f;--surface-3:#0d1a21;--hover:#1b2f39;\n--ink:#e8f1f5;--ink-2:#a9bdc6;--ink-3:#c1d0d7;--ink-4:#8fa4ae;\n--line:#26393f;--line-2:#1e303a;--line-3:#33505c;--line-4:#3c5967;\n--blue-text:#86cdf0;--blue-ink:#5cb7e4;--green-text:#a6d982;\n--tint-blue:#15303d;--tint-green:#1b3020;--tint-band:#0d202a;--tab-bg:#17292f;--input:#0c1920;\n--ink-fill:#e8f1f5;--ink-fill-text:#0d1f28;--ink-fill-hover:#ffffff;\n--deep:#0f232d;--deep-2:#183542;\n--warn-bg:#3b3011;--warn-fg:#f3d47e;--flag-bg:#432019;--flag-fg:#f6b5a8;--ok-bg:#1c3a1e;--ok-fg:#b7e39b;--roi-blue:#15303d;--roi-green:#1b3020;\n--glass:rgba(17,31,39,.78);--glass-2:rgba(17,31,39,.93);--glass-line:rgba(60,89,103,.55);--back:rgba(17,31,39,.55);}}\n:root[data-theme=\"dark\"]{color-scheme:dark;\n--bg:#09151b;--surface:#111f27;--surface-2:#15262f;--surface-3:#0d1a21;--hover:#1b2f39;\n--ink:#e8f1f5;--ink-2:#a9bdc6;--ink-3:#c1d0d7;--ink-4:#8fa4ae;\n--line:#26393f;--line-2:#1e303a;--line-3:#33505c;--line-4:#3c5967;\n--blue-text:#86cdf0;--blue-ink:#5cb7e4;--green-text:#a6d982;\n--tint-blue:#15303d;--tint-green:#1b3020;--tint-band:#0d202a;--tab-bg:#17292f;--input:#0c1920;\n--ink-fill:#e8f1f5;--ink-fill-text:#0d1f28;--ink-fill-hover:#ffffff;\n--deep:#0f232d;--deep-2:#183542;\n--warn-bg:#3b3011;--warn-fg:#f3d47e;--flag-bg:#432019;--flag-fg:#f6b5a8;--ok-bg:#1c3a1e;--ok-fg:#b7e39b;--roi-blue:#15303d;--roi-green:#1b3020;\n--glass:rgba(17,31,39,.78);--glass-2:rgba(17,31,39,.93);--glass-line:rgba(60,89,103,.55);--back:rgba(17,31,39,.55);}\n:root[data-theme=\"light\"]{color-scheme:light}\n@keyframes cw-pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}\n@keyframes cw-pulse{0%{box-shadow:0 0 0 0 rgba(24,120,164,.5)}70%,100%{box-shadow:0 0 0 7px rgba(24,120,164,0)}}\n@keyframes cw-dash{to{background-position:12px 0}}\n@keyframes cw-dashv{to{background-position:0 12px}}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}\n\n/* buttons: primary = filled, secondary = outlined, tertiary = text + arrow */\n.cw-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:99px;border:1.5px solid transparent;font:700 16px/1 'DM Sans',sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;box-sizing:border-box;transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s,transform .2s}\n.cw-btn .arr,.cw-tile .arr{display:inline-block;transition:transform .2s}\n.cw-btn:hover .arr,.cw-tile:hover .arr{transform:translateX(5px)}\n.cw-btn:active{transform:translateY(1px)}\n.cw-btn-lg{min-height:60px;padding:0 32px;font-size:17px}\n.cw-btn-sm{min-height:44px;padding:0 22px;font-size:15px}\n.cw-btn-primary,.cw-btn-blue{background:var(--cw-blue);color:#fff}\n.cw-btn-primary:hover,.cw-btn-blue:hover{background:var(--cw-blue-600);color:#fff;box-shadow:0 12px 24px -12px rgba(24,120,164,.8)}\n.cw-btn-green{background:var(--cw-green-600);color:#fff}\n.cw-btn-green:hover{background:var(--cw-green-700);color:#fff;box-shadow:0 12px 24px -12px rgba(77,130,48,.8)}\n.cw-btn-ink{background:var(--ink-fill);color:var(--ink-fill-text)}\n.cw-btn-ink:hover{background:var(--ink-fill-hover);color:var(--ink-fill-text)}\n.cw-btn-secondary{border-color:var(--ink);color:var(--ink);background:transparent}\n.cw-btn-secondary:hover{border-color:var(--blue-ink);color:var(--blue-text);background:var(--surface)}\n.cw-btn-inverse{background:#fff;color:var(--cw-blue-700)}\n.cw-btn-inverse:hover{background:#e6f1f6;color:var(--cw-blue-700);box-shadow:0 12px 24px -12px rgba(0,0,0,.35)}\n.cw-tile{flex:1 1 320px;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:96px;padding:0 32px;border-radius:28px;border:1px solid transparent;font:800 28px 'Bricolage Grotesque',sans-serif;letter-spacing:-.01em;text-decoration:none;transition:background-color .2s,border-color .2s,color .2s,transform .2s,box-shadow .2s}\n.cw-tile:hover{transform:translateY(-2px)}\n.cw-tile-blue{background:var(--cw-blue);color:#fff}\n.cw-tile-blue:hover{background:var(--cw-blue-600);color:#fff;box-shadow:0 20px 36px -20px rgba(24,120,164,.9)}\n.cw-tile-green{background:var(--cw-green-600);color:#fff}\n.cw-tile-green:hover{background:var(--cw-green-700);color:#fff;box-shadow:0 20px 36px -2 x;border-radius:4px;background:var(--pc);opacity:.85}.cw-vprog i:last-child{background:linear-gradient(90deg,var(--pc) 45%,var(--line-3) 45%)}\n@media (max-width:1000px){.cw-vrow,.cw-vprog{grid-template-columns:repeat(2,1fr);gap:20px 28px}.cw-vst:nth-child(2n)::after{display:none}.cw-vprog{display:none}}\n@media (max-width:560px){.cw-vrow{grid-template-columns:1fr}.cw-vst::after{display:none!important}.cw-vst{min-height:0}}\n@media (prefers-reduced-motion:reduce){.cw-vst{animation:none}.flowline path{animation:none}}\n/* home tile illustrations */\n.cw-tvw{display:block;align-self:flex-end;width:min(100%,460px);margin-top:10px;padding-bottom:26px}.cw-tv{width:100%;height:auto;display:block}.tv .prog{animation:none}\n.cw-prod{padding-bottom:0}\n.cw-tvw .tv{overflow:visible}\n/* open items (level 1) */\n.cw-opengrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:28px 36px}\n.cw-open{display:flex;flex-direction:column;gap:16px;padding:20px 2px 10px;border-top:1px solid var(--line-3);transition:border-color .25s}\n.cw-open:hover{border-top-color:var(--cw-blue)}\n.cw-open.acc-green:hover{border-top-color:var(--cw-green-600)}\n.cw-open .k{font-size:13px;letter-spacing:.12em;color:var(--blue-text)}.cw-open.acc-green .k{color:var(--green-text)}\n.cw-open .t{font:700 22px/1.12 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}\n.cw-open .d{margin-top:10px;font-size:16px;line-height:1.55;color:var(--ink-2);max-width:44ch}\n/* editorial tabs + rows */\n.cw-etabs{display:flex;gap:clamp(20px,3.2vw,44px);border-bottom:1px solid var(--line-3);overflow-x:auto;scrollbar-width:none;padding-bottom:0}\n.cw-et{position:relative;flex:none;cursor:pointer;background:none;border:0;padding:14px 0 16px;font:700 clamp(17px,1.6vw,21px)/1.1 'Bricolage Grotesque',sans-serif;letter-spacing:-.015em;color:var(--ink-4);white-space:nowrap;transition:color .2s}\n.cw-et::after{content:\"\";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px;background:var(--cw-blue);transform:scaleX(0);transform-origin:left;transition:transform .3s}\n.cw-et:hover{color:var(--ink)}.cw-et[aria-selected=\"true\"]{color:var(--ink)}.cw-et[aria-selected=\"true\"]::after{transform:scaleX(1)}\n.cw-rows{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));column-gap:56px}\n.cw-row{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding:26px 0;border-top:1px solid var(--line-3);transition:border-color .25s}\n.cw-row:hover{border-top-color:var(--acc)}\n.cw-row .t{font:700 clamp(20px,1.9vw,24px)/1.15 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}\n.cw-row .d{margin-top:8px;font-size:16px;line-height:1.5;color:var(--ink-2);max-width:48ch}\n.cw-row .d:empty{display:none}\n.cw-row .go{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px;font-weight:700;color:var(--acc);text-decoration:none;white-space:nowrap}\n.cw-row .go .arr{display:inline-block;transition:transform .2s}.cw-row .go:hover{text-decoration:underline}.cw-row .go:hover .arr{transform:translate(4px,-4px)}\n@media (max-width:560px){.cw-row{flex-direction:column;gap:6px}}\n/* press states + arrow language */\n.cw-btn:active,.cw-tile:active,.cw-prod:active,.cw-ag:active{transform:translateY(1px)!important}\na:hover>.arr,a:hover .arr{transform:translateX(5px)}.arr{display:inline-block;transition:transform .2s}\n.cw-row .go:hover .arr{transform:translate(4px,-4px)}\n.cw-nav div.cw-dd:first-of-type .cw-navgrp>a{font-weight:700}\np{max-width:72ch}\n/* mega-menu thumbnails */\n.cw-mth{flex:none;width:64px;height:50px;border-radius:10px;display:grid;place-items:center;overflow:hidden}\n.cw-mth svg{width:100%;height:100%;display:block}\n/* CTA band + open band texture */\n.cw-band{position:relative}\n.cw-vst:not(:last-child)::after{width:28px;height:28px;right:-28px;font-size:14px}\n.cw-vrow{counter-reset:vs}.cw-vh .n::before{counter-increment:vs;content:\"0\" counter(vs)}\n@media (max-width:700px){.cw-etabs{flex-wrap:wrap;overflow:visible;gap:0 22px}.cw-et{padding:12px 0 14px;font-size:17px}}\n@media (max-width:560px){.cw-ptabs{display:flex!important;width:100%;box-sizing:border-box;border-radius:26px!important}.cw-ptabs .cw-tab{flex:1 1 auto;padding:0 12px!important;white-space:nowrap;font-size:14px!important}}\n.cw-cat{margin:40px 0 0;font:800 clamp(30px,3.6vw,46px)/1.04 'Bricolage Grotesque',sans-serif;letter-spacing:-.035em}\n.cw-vh{min-height:40px}\n.cw-rcol p{max-width:60ch}\n.cw-rcol .cw-close{margin:26px 0 0;padding-top:22px;border-top:1px solid var(--line);font:500 19px/1.55 'DM Sans',sans-serif;color:var(--ink);max-width:60ch}\n.cw-rcol .cw-close em{font-style:normal;font-weight:700;color:var(--green-text)}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;padding:16px;box-sizing:border-box;overflow-x:clip;min-height:100vh\">\n\u003cdiv style=\"max-width:1240px;margin:0 auto\">\n\u003cdc-import name=\"CW Header\" active=\"tech\" hint-size=\"100%,60px\" style=\"position:sticky;top:12px;z-index:50;display:block;margin-bottom:12px\">\u003c/dc-import>\n\n\u003csection style=\"padding:clamp(40px,5vw,72px) clamp(8px,2.5vw,32px) clamp(28px,3vw,40px)\">\n  \u003cdiv style=\"font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-text)\">Technology\u003c/div>\n  \u003ch1 style=\"margin:16px 0 0;font:800 clamp(40px,5.2vw,72px)/1.02 'Bricolage Grotesque';letter-spacing:-0.04em;max-width:16ch;text-wrap:balance\">The Engine Behind Deterministic Decisioning\u003c/h1>\n  \u003cp style=\"margin:18px 0 0;color:var(--ink-2);font-size:clamp(17px,1.6vw,20px);max-width:56ch\">Interactive flow tracing how enterprise data moves from raw inputs to business outcomes.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"cw-band cw-bleed\" onMouseEnter=\"{{ hold }}\" onMouseLeave=\"{{ release }}\" onFocus=\"{{ hold }}\" onBlur=\"{{ release }}\">\n  \u003cdiv class=\"cw-flow\">\n    \u003csc-for list=\"{{ nodes }}\" as=\"n\" hint-placeholder-count=\"4\">\u003cdiv style=\"display:contents\">\u003cbutton type=\"button\" class=\"cw-nb {{ n.cls }}\" aria-pressed=\"{{ n.pressed }}\" onClick=\"{{ n.pick }}\">\u003cb class=\"n\">{{ n.num }}\u003c/b>\u003cdiv class=\"t\">{{ n.title }}\u003c/div>\u003cdiv class=\"s\">{{ n.sub }}\u003c/div>\u003csc-if value=\"{{ n.showProg }}\" hint-placeholder-val=\"{{ false }}\">\u003cspan class=\"cw-prog\" aria-hidden=\"true\">\u003ci style=\"width:{{ n.pw }}%\">\u003c/i>\u003c/span>\u003c/sc-if>\u003c/button>\u003csc-if value=\"{{ n.hasConn }}\" hint-placeholder-val=\"{{ true }}\">\u003cspan class=\"cw-conn {{ n.connCls }}\" aria-hidden=\"true\">\u003c/span>\u003c/sc-if>\u003c/div>\u003c/sc-for>\n  \u003c/div>\n  \u003cdiv class=\"cw-detail\">\n    \u003cdiv class=\"cw-detail-in\">\u003csc-for list=\"{{ panels }}\" as=\"d\" hint-placeholder-count=\"4\">\u003cdiv style=\"opacity:{{ d.op }};visibility:{{ d.vis }}\" aria-hidden=\"{{ d.hid }}\">\u003cspan style=\"font:800 clamp(56px,7vw,96px)/.9 'Bricolage Grotesque';letter-spacing:-0.05em;color:var(--blue-ink)\">{{ d.num }}\u003c/span>\u003cp style=\"margin:0;font-size:clamp(17px,1.6vw,21px);line-height:1.55;max-width:66ch;color:var(--ink)\">\u003cb style=\"color:var(--green-text)\">{{ d.title }}:\u003c/b> {{ d.detail }}\u003c/p>\u003c/div>\u003c/sc-for>\u003c/div>\n    \u003cbutton type=\"button\" class=\"cw-pp\" aria-label=\"{{ ppLabel }}\" onClick=\"{{ toggle }}\">\u003csc-if value=\"{{ isPlaying }}\" hint-placeholder-val=\"{{ true }}\">\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"currentColor\" aria-hidden=\"true\">\u003crect x=\"3.5\" y=\"2.5\" width=\"3\" height=\"11\" rx=\"1\"/>\u003crect x=\"9.5\" y=\"2.5\" width=\"3\" height=\"11\" rx=\"1\"/>\u003c/svg>\u003c/sc-if>\u003csc-if value=\"{{ isPaused }}\" hint-placeholder-val=\"{{ false }}\">\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"currentColor\" aria-hidden=\"true\">\u003cpath d=\"M4 2.5v11l9-5.5z\"/>\u003c/svg>\u003c/sc-if>\u003c/button>\n  \u003c/div>\n\u003c/section>\n\n\u003csection style=\"margin-top:56px;padding:0 clamp(8px,2.5vw,32px) 44px\">\n  \u003ch2 style=\"margin:0;font:800 clamp(28px,3.4vw,44px)/1.05 'Bricolage Grotesque';letter-spacing:-0.035em;max-width:22ch;text-wrap:balance\">Built for Demanding Enterprise Environments\u003c/h2>\n  \u003cdiv class=\"cw-opengrid\" style=\"margin-top:32px\">\n    \u003csc-for list=\"{{ caps }}\" as=\"c\" hint-placeholder-count=\"6\">\u003cdiv class=\"cw-open cw-rv\">\u003cb class=\"k\" style=\"color:{{ c.fg }}\">{{ c.n }}\u003c/b>\u003cdiv>\u003cdiv class=\"t\">{{ c.t }}\u003c/div>\u003cdiv class=\"d\">{{ c.d }}\u003c/div>\u003c/div>\u003c/div>\u003c/sc-for>\n  \u003c/div>\n\u003c/section>\n\u003cdc-import name=\"CW Footer\" hint-size=\"100%,64px\">\u003c/dc-import>\n\u003c/div>\n\u003c/div>\n\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script>\nclass Component extends DCLogic {\n  state = { active: 2, p: 0, playing: true };\n  DUR = 4500;\n  NODES = [\n    { num: '01', title: 'Data Inputs', sub: 'Documents & APIs', detail: 'Ingests borrower documents, bank statements, bureau data and enterprise APIs into a single normalised case record.' },\n    { num: '02', title: 'Business Rules', sub: 'Configurable Logic', detail: 'Applies versioned, business-owned policy rules — eligibility, thresholds and validations — without hardcoding.' },\n    { num: '03', title: 'AI Reasoning', sub: 'Neuro-Symbolic Agent', detail: 'Combines domain rules with generative agents to evaluate risks without hallucinations or black-box guesswork.' },\n    { num: '04', title: 'Decision Engine', sub: 'Audit & Traceability', detail: 'Produces a traceable outcome with every rule, input and agent finding logged for audit and maker-checker review.' }\n  ];\n  componentDidMount() {\n    try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) this.setState({ playing: false }); } catch (e) {}\n    this._t = setInterval(() => {\n      if (!this.state.playing || this._hold) return;\n      const p = this.state.p + 60 / this.DUR;\n      if (p >= 1) this.setState(s => ({ active: (s.active + 1) % 4, p: 0 })); else this.setState({ p });\n    }, 60);\n  }\n  componentWillUnmount() { clearInterval(this._t); }\n  renderVals() {\n    const a = this.state.active, pl = this.state.playing;\n    return {\n      nodes: this.NODES.map((n, i) => ({ ...n, cls: i === a ? 'on' : '', pressed: String(i === a), showProg: i === a && pl, pw: Math.round(this.state.p * 100), hasConn: i \u003c 3, connCls: i \u003c a ? 'done' : (i === a && pl ? 'flow' : ''), pick: () => this.setState({ active: i, p: 0, playing: false }) })),\n      panels: this.NODES.map((n, i) => ({ ...n, op: i === a ? 1 : 0, vis: i === a ? 'visible' : 'hidden', hid: String(i !== a) })),\n      isPlaying: pl, isPaused: !pl, ppLabel: pl ? 'Pause' : 'Play',\n      toggle: () => this.setState(s => ({ playing: !s.playing })),\n      hold: () => { this._hold = true; }, release: () => { this._hold = false; },\n      caps: [['Modular Architecture', 'Decoupled services for maximum flexibility.'], ['Configurable Rules', 'Policy execution without hardcoding logic.'], ['Workflow Orchestration', 'Digital approval and exception handling paths.'], ['Agentic AI Systems', 'Practical AI agents with strict guardrails.'], ['Enterprise Data Pipes', 'Seamless connection across legacy ecosystem systems.'], ['Complete Auditability', 'Transaction-level traceability and logging.']]\n        .map((c, i) => ({ n: '0' + (i + 1), t: c[0], d: c[1], fg: i % 2 ? 'var(--green-text)' : 'var(--blue-text)', bg: i % 2 ? 'var(--tint-green)' : 'var(--tint-blue)' }))\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Codeworks Services.dc.html":"\u003c!DOCTYPE html>\n\u003chtml>\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>body{margin:0;background:var(--bg)}:focus-visible{outline:2px solid #1878a4;outline-offset:2px}a{color:var(--blue-text)}a:hover{color:var(--blue-ink)}\n:root{color-scheme:light;--cw-blue:#1878a4;--cw-blue-600:#125f82;--cw-blue-700:#0b4a66;--cw-green:#5c903c;--cw-green-600:#4d8230;--cw-green-700:#3d6522;\n--bg:#f1f6f8;--surface:#ffffff;--surface-2:#f5f9fb;--surface-3:#f3f8fa;--hover:#eef4f7;\n--ink:#0d1f28;--ink-2:#485c65;--ink-3:#33474f;--ink-4:#5a6d76;\n--line:#d4e1e7;--line-2:#e3ecf0;--line-3:#c3d6df;--line-4:#b9c8cf;\n--blue-text:#0b5577;--blue-ink:#1878a4;--green-text:#3d6522;\n--tint-blue:#e0eef5;--tint-green:#e3eed9;--tint-band:#e7f0f4;--tab-bg:#e2ebf0;--input:#f7fafb;\n--ink-fill:#0d1f28;--ink-fill-text:#ffffff;--ink-fill-hover:#1c3541;\n--deep:#0d1f28;--deep-2:#152f3b;\n--warn-bg:#f6dfa8;--warn-fg:#5c3f00;--flag-bg:#f3c4bc;--flag-fg:#7a1f12;--ok-bg:#cfe5bd;--ok-fg:#2f5219;--roi-blue:#e0eef5;--roi-green:#e6f0dc;\n--glass:rgba(255,255,255,.8);--glass-2:rgba(255,255,255,.93);--glass-line:rgba(207,221,228,.9);--back:rgba(255,255,255,.55);}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){color-scheme:dark;\n--bg:#09151b;--surface:#111f27;--surface-2:#15262f;--surface-3:#0d1a21;--hover:#1b2f39;\n--ink:#e8f1f5;--ink-2:#a9bdc6;--ink-3:#c1d0d7;--ink-4:#8fa4ae;\n--line:#26393f;--line-2:#1e303a;--line-3:#33505c;--line-4:#3c5967;\n--blue-text:#86cdf0;--blue-ink:#5cb7e4;--green-text:#a6d982;\n--tint-blue:#15303d;--tint-green:#1b3020;--tint-band:#0d202a;--tab-bg:#17292f;--input:#0c1920;\n--ink-fill:#e8f1f5;--ink-fill-text:#0d1f28;--ink-fill-hover:#ffffff;\n--deep:#0f232d;--deep-2:#183542;\n--warn-bg:#3b3011;--warn-fg:#f3d47e;--flag-bg:#432019;--flag-fg:#f6b5a8;--ok-bg:#1c3a1e;--ok-fg:#b7e39b;--roi-blue:#15303d;--roi-green:#1b3020;\n--glass:rgba(17,31,39,.78);--glass-2:rgba(17,31,39,.93);--glass-line:rgba(60,89,103,.55);--back:rgba(17,31,39,.55);}}\n:root[data-theme=\"dark\"]{color-scheme:dark;\n--bg:#09151b;--surface:#111f27;--surface-2:#15262f;--surface-3:#0d1a21;--hover:#1b2f39;\n--ink:#e8f1f5;--ink-2:#a9bdc6;--ink-3:#c1d0d7;--ink-4:#8fa4ae;\n--line:#26393f;--line-2:#1e303a;--line-3:#33505c;--line-4:#3c5967;\n--blue-text:#86cdf0;--blue-ink:#5cb7e4;--green-text:#a6d982;\n--tint-blue:#15303d;--tint-green:#1b3020;--tint-band:#0d202a;--tab-bg:#17292f;--input:#0c1920;\n--ink-fill:#e8f1f5;--ink-fill-text:#0d1f28;--ink-fill-hover:#ffffff;\n--deep:#0f232d;--deep-2:#183542;\n--warn-bg:#3b3011;--warn-fg:#f3d47e;--flag-bg:#432019;--flag-fg:#f6b5a8;--ok-bg:#1c3a1e;--ok-fg:#b7e39b;--roi-blue:#15303d;--roi-green:#1b3020;\n--glass:rgba(17,31,39,.78);--glass-2:rgba(17,31,39,.93);--glass-line:rgba(60,89,103,.55);--back:rgba(17,31,39,.55);}\n:root[data-theme=\"light\"]{color-scheme:light}\n@keyframes cw-pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}\n@keyframes cw-pulse{0%{box-shadow:0 0 0 0 rgba(24,120,164,.5)}70%,100%{box-shadow:0 0 0 7px rgba(24,120,164,0)}}\n@keyframes cw-dash{to{background-position:12px 0}}\n@keyframes cw-dashv{to{background-position:0 12px}}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}\n\n/* buttons: primary = filled, secondary = outlined, tertiary = text + arrow */\n.cw-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:99px;border:1.5px solid transparent;font:700 16px/1 'DM Sans',sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;box-sizing:border-box;transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s,transform .2s}\n.cw-btn .arr,.cw-tile .arr{display:inline-block;transition:transform .2s}\n.cw-btn:hover .arr,.cw-tile:hover .arr{transform:translateX(5px)}\n.cw-btn:active{transform:translateY(1px)}\n.cw-btn-lg{min-height:60px;padding:0 32px;font-size:17px}\n.cw-btn-sm{min-height:44px;padding:0 22px;font-size:15px}\n.cw-btn-primary,.cw-btn-blue{background:var(--cw-blue);color:#fff}\n.cw-btn-primary:hover,.cw-btn-blue:hover{background:var(--cw-blue-600);color:#fff;box-shadow:0 12px 24px -12px rgba(24,120,164,.8)}\n.cw-btn-green{background:var(--cw-green-600);color:#fff}\n.cw-btn-green:hover{background:var(--cw-green-700);color:#fff;box-shadow:0 12px 24px -12px rgba(77,130,48,.8)}\n.cw-btn-ink{background:var(--ink-fill);color:var(--ink-fill-text)}\n.cw-btn-ink:hover{background:var(--ink-fill-hover);color:var(--ink-fill-text)}\n.cw-btn-secondary{border-color:var(--ink);color:var(--ink);background:transparent}\n.cw-btn-secondary:hover{border-color:var(--blue-ink);color:var(--blue-text);background:var(--surface)}\n.cw-btn-inverse{background:#fff;color:var(--cw-blue-700)}\n.cw-btn-inverse:hover{background:#e6f1f6;color:var(--cw-blue-700);box-shadow:0 12px 24px -12px rgba(0,0,0,.35)}\n.cw-tile{flex:1 1 320px;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:96px;padding:0 32px;border-radius:28px;border:1px solid transparent;font:800 28px 'Bricolage Grotesque',sans-serif;letter-spacing:-.01em;text-decoration:none;transition:background-color .2s,border-color .2s,color .2s,transform .2s,box-shadow .2s}\n.cw-tile:hover{transform:translateY(-2px)}\n.cw-tile-blue{background:var(--cw-blue);color:#fff}\n.cw-tile-blue:hover{background:var(--cw-blue-600);color:#fff;box-shadow:0 20px 36px -20px rgba(24,120,164,.9)}\n.cw-tile-green{background:var(--cw-green-600);color:#fff}\n.cw-tile-green:hover{background:var(--cw-green-700);color:#fff;box-shadow:0 20px 36px -20px rgba(77,130,48,.9)}\n.cw-tile-out{background:var(--surface);border-color:var(--line);color:var(--ink)}\n.cw-tile-out.to-blue:hover{border-color:var(--cw-blue);color:var(--blue-text);background:var(--surface)}\n.cw-tile-out.to-green:hover{border-color:var(--cw-green-600);color:var(--green-text);background:var(--surface)}\n\n/* header */\n.cw-hdr{display:flex;align-items:center;gap:12px 20px;padding:10px 10px 10px 28px;min-height:68px;box-sizing:border-box;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border:1px solid var(--glass-line);box-shadow:0 1px 2px rgba(13,42,58,.04);transition:box-shadow .25s,background-color .25s}\n.cw-hdr.sc{background:var(--glass-2);box-shadow:0 16px 36px -16px rgba(13,42,58,.3)}\n.cw-nav{margin-left:auto;display:flex;align-items:center;gap:2px;font-size:clamp(13.5px,1.3vw,15px);font-weight:500;white-space:nowrap}\n.cw-navi{position:relative;display:inline-flex;align-items:center;min-height:42px;border-radius:99px;color:var(--ink-3);text-decoration:none;transition:background-color .2s,color .2s}\na.cw-navi{padding:0 clamp(10px,1.2vw,15px)}\n.cw-navgrp>a{display:inline-flex;align-items:center;min-height:42px;padding:0 0 0 clamp(10px,1.2vw,15px);color:inherit;text-decoration:none}\n.cw-navgrp>a:hover{color:inherit}\n.cw-navi:hover{background:var(--hover);color:var(--blue-text)}\n.cw-navi.on{background:var(--tint-blue);color:var(--blue-text);font-weight:700}\n.cw-chev{display:inline-grid;place-items:center;width:32px;height:42px;padding:0 8px 0 2px;background:none;border:0;color:inherit;cursor:pointer;border-radius:0 99px 99px 0;box-sizing:border-box}\n.cw-chev svg{transition:transform .2s}\n.cw-chev.open svg{transform:rotate(180deg)}\n.cw-dd{position:relative}\n.cw-menu-wrap{position:absolute;top:100%;padding-top:10px;z-index:60}\n.cw-menu{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:0 26px 50px -18px rgba(13,42,58,.32),0 2px 6px rgba(13,42,58,.06);animation:cw-pop .18s ease-out;transform-origin:top left}\n.cw-mi{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:500;transition:background-color .15s,color .15s}\n.cw-mi:hover{background:var(--hover);color:var(--ink)}\n.cw-mi.on{background:var(--tint-blue)}\n.cw-mi .arr{margin-left:auto;color:var(--ink-4);transition:transform .2s,color .2s}\n.cw-mi:hover .arr{color:var(--blue-ink);transform:translateX(4px)}\n.cw-sw{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#fff;font:800 18px 'Bricolage Grotesque',sans-serif}\n.cw-mt{display:flex;flex-direction:column;gap:2px;min-width:0}\n.cw-mt b{font-size:15.5px;font-weight:700}\n.cw-mt small{font-size:13.5px;color:var(--ink-2);line-height:1.35;white-space:normal;font-weight:400}\n.cw-mi-all{margin-top:6px;padding-top:14px;border-top:1px solid var(--line-2);border-radius:0 0 14px 14px}\n.cw-burger{margin-left:auto;width:46px;height:46px;border-radius:50%;border:1px solid var(--line-3);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:border-color .2s,color .2s}\n.cw-burger:hover{border-color:var(--cw-blue);color:var(--blue-text)}\n.cw-mnav a.cw-ml{display:flex;align-items:center;min-height:44px;border-bottom:1px solid var(--line-2);color:var(--ink);text-decoration:none}\n.cw-mnav a.cw-ml:hover{color:var(--cw-blue-700)}\n\n/* home hero: app window */\n.cw-stage{position:relative;padding:0 0 30px}\n.cw-glow{position:absolute;inset:-56px -40px -20px -48px;background:linear-gradient(120deg,rgba(24,120,164,.2),rgba(92,144,60,.18));-webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);z-index:0;pointer-events:none}\n.cw-back{position:absolute;left:18px;right:-18px;top:18px;bottom:48px;border-radius:22px;background:var(--back);border:1px solid var(--line);z-index:0}\n.cw-win{padding-bottom:34px;position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 1px 0 rgba(13,42,58,.03),0 34px 60px -24px rgba(13,42,58,.32),0 12px 24px -12px rgba(13,42,58,.12)}\n.cw-bar{display:flex;align-items:center;gap:14px;padding:13px 18px;background:var(--surface-2);border-bottom:1px solid var(--line-2)}\n.cw-dots{display:flex;gap:7px;flex:none}\n.cw-dots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}\n.cw-wt{font-size:13px;font-weight:500;color:var(--ink-2);min-width:0}\n.cw-seg{display:flex;gap:5px;padding:18px 22px 6px}\n.cw-seg i{flex:1;height:5px;border-radius:5px;background:var(--line)}\n.cw-seg i.done{background:var(--cw-green-600)}.cw-seg i.run{background:var(--cw-blue)}.cw-seg i.ready{background:var(--cw-green)}\n.cw-steps{padding:4px 22px 6px}\n.cw-step{position:relative;display:flex;align-items:center;gap:14px;padding:9px 0;font-size:16px;font-weight:500}\n.cw-step:not(:last-child)::after{content:\"\";position:absolute;left:15px;top:calc(100% - 9px);height:18px;width:2px;background:var(--line-2)}\n.cw-step>span:nth-child(2){flex:1;min-width:0}\n.cw-node{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:700;border:1.5px solid var(--line-3);color:var(--ink-4);background:var(--surface);box-sizing:border-box}\n.cw-node.done{background:var(--cw-green-600);border-color:var(--cw-green-600);color:#fff}\n.cw-node.run{border-color:var(--cw-blue);color:var(--cw-blue-700);background:var(--tint-blue)}\n.cw-node.ready{border-color:var(--cw-green-600);color:var(--cw-green-700);background:var(--tint-green)}\n.cw-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:none;white-space:nowrap}\n.cw-pill i{width:7px;height:7px;border-radius:50%;background:currentColor}\n.cw-pill.done,.cw-pi g:12px 0 14px;font-size:17px}}\n@media (max-width:560px){.cw-ptabs{display:flex!important;width:100%;box-sizing:border-box;border-radius:26px!important}.cw-ptabs .cw-tab{flex:1 1 auto;padding:0 12px!important;white-space:nowrap;font-size:14px!important}}\n.cw-cat{margin:40px 0 0;font:800 clamp(30px,3.6vw,46px)/1.04 'Bricolage Grotesque',sans-serif;letter-spacing:-.035em}\n.cw-vh{min-height:40px}\n.cw-rcol p{max-width:60ch}\n.cw-rcol .cw-close{margin:26px 0 0;padding-top:22px;border-top:1px solid var(--line);font:500 19px/1.55 'DM Sans',sans-serif;color:var(--ink);max-width:60ch}\n.cw-rcol .cw-close em{font-style:normal;font-weight:700;color:var(--green-text)}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;padding:16px;box-sizing:border-box;overflow-x:clip;min-height:100vh\">\n\u003cdiv style=\"max-width:1240px;margin:0 auto\">\n\u003cdc-import name=\"CW Header\" active=\"services\" hint-size=\"100%,60px\" style=\"position:sticky;top:12px;z-index:50;display:block;margin-bottom:12px\">\u003c/dc-import>\n\n\u003csection style=\"padding:clamp(40px,5vw,72px) clamp(8px,2.5vw,32px) clamp(32px,4vw,48px)\">\n  \u003cdiv style=\"font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-text)\">Services\u003c/div>\n  \u003ch1 style=\"margin:16px 0 0;font:800 clamp(40px,5.2vw,72px)/1.02 'Bricolage Grotesque';letter-spacing:-0.04em;max-width:16ch;text-wrap:balance\">Technology Built Around How Businesses Actually Work\u003c/h1>\n\u003c/section>\n\n\u003csection class=\"cw-two\">\n  \u003csc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"4\">\n    \u003cdiv class=\"cw-rv\" style=\"background:{{ s.bg }};border:1px solid {{ s.bd }};border-radius:28px;padding:clamp(24px,3vw,36px);min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:32px\">\n      \u003cb style=\"font-size:14px;letter-spacing:.12em;color:{{ s.fg }}\">{{ s.n }}\u003c/b>\n      \u003cdiv>\u003ch3 style=\"margin:0;font:700 clamp(26px,2.6vw,32px)/1.08 'Bricolage Grotesque';letter-spacing:-0.025em\">{{ s.t }}\u003c/h3>\u003cp style=\"margin:12px 0 0;font-size:18px;line-height:1.5;color:var(--ink-2);max-width:34ch\">{{ s.d }}\u003c/p>\u003cdiv style=\"margin-top:18px;font-size:15px;font-weight:700;color:{{ s.fg }}\">→ {{ s.tag }}\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/sc-for>\n\u003c/section>\n\n\u003csection style=\"margin-top:64px;background:#1878a4;color:#fff;border-radius:32px;padding:clamp(32px,5vw,56px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px 32px\">\n  \u003ch2 style=\"margin:0;font:800 clamp(34px,4.6vw,56px)/1 'Bricolage Grotesque';letter-spacing:-0.04em;max-width:14ch\">Schedule Architecture Review\u003c/h2>\n  \u003ca class=\"cw-btn cw-btn-inverse cw-btn-lg\" href=\"Codeworks%20Contact.dc.html\">Talk to Us \u003cspan class=\"arr\">→\u003c/span>\u003c/a>\n\u003c/section>\n\u003cdc-import name=\"CW Footer\" hint-size=\"100%,64px\">\u003c/dc-import>\n\u003c/div>\n\u003c/div>\n\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script>\nclass Component extends DCLogic {\n  renderVals() {\n    const S = [['Product Engineering', 'Architecture to deployment for mission-critical systems.', 'Architectural Specs'], ['Data & AI', 'Deterministic AI reasoning, agentic workflows and intelligent decision engines.', 'Data Pipeline Controls'], ['Modernisation', 'Transform legacy applications without disrupting ongoing business logic.', 'Continuity Protections'], ['Build–Operate–Transfer', 'Build, operate and transfer technology capabilities to your organisation.', 'Structured Handover']];\n    return { services: S.map((s, i) => ({ n: '0' + (i + 1), t: s[0], d: s[1], tag: s[2], bg: i % 2 ? 'var(--tint-green)' : 'var(--tint-blue)', bd: i % 2 ? 'var(--line)' : 'var(--line)', fg: i % 2 ? 'var(--green-text)' : 'var(--blue-text)' })) };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Codeworks Resources.dc.html":"\u003c!DOCTYPE html>\n\u003chtml>\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>body{margin:0;background:var(--bg)}:focus-visible{outline:2px solid #1878a4;outline-offset:2px}a{color:var(--blue-text)}a:hover{color:var(--blue-ink)}\n:root{color-scheme:light;--cw-blue:#1878a4;--cw-blue-600:#125f82;--cw-blue-700:#0b4a66;--cw-green:#5c903c;--cw-green-600:#4d8230;--cw-green-700:#3d6522;\n--bg:#f1f6f8;--surface:#ffffff;--surface-2:#f5f9fb;--surface-3:#f3f8fa;--hover:#eef4f7;\n--ink:#0d1f28;--ink-2:#485c65;--ink-3:#33474f;--ink-4:#5a6d76;\n--line:#d4e1e7;--line-2:#e3ecf0;--line-3:#c3d6df;--line-4:#b9c8cf;\n--blue-text:#0b5577;--blue-ink:#1878a4;--green-text:#3d6522;\n--tint-blue:#e0eef5;--tint-green:#e3eed9;--tint-band:#e7f0f4;--tab-bg:#e2ebf0;--input:#f7fafb;\n--ink-fill:#0d1f28;--ink-fill-text:#ffffff;--ink-fill-hover:#1c3541;\n--deep:#0d1f28;--deep-2:#152f3b;\n--warn-bg:#f6dfa8;--warn-fg:#5c3f00;--flag-bg:#f3c4bc;--flag-fg:#7a1f12;--ok-bg:#cfe5bd;--ok-fg:#2f5219;--roi-blue:#e0eef5;--roi-green:#e6f0dc;\n--glass:rgba(255,255,255,.8);--glass-2:rgba(255,255,255,.93);--glass-line:rgba(207,221,228,.9);--back:rgba(255,255,255,.55);}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){color-scheme:dark;\n--bg:#09151b;--surface:#111f27;--surface-2:#15262f;--surface-3:#0d1a21;--hover:#1b2f39;\n--ink:#e8f1f5;--ink-2:#a9bdc6;--ink-3:#c1d0d7;--ink-4:#8fa4ae;\n--line:#26393f;--line-2:#1e303a;--line-3:#33505c;--line-4:#3c5967;\n--blue-text:#86cdf0;--blue-ink:#5cb7e4;--green-text:#a6d982;\n--tint-blue:#15303d;--tint-green:#1b3020;--tint-band:#0d202a;--tab-bg:#17292f;--input:#0c1920;\n--ink-fill:#e8f1f5;--ink-fill-text:#0d1f28;--ink-fill-hover:#ffffff;\n--deep:#0f232d;--deep-2:#183542;\n--warn-bg:#3b3011;--warn-fg:#f3d47e;--flag-bg:#432019;--flag-fg:#f6b5a8;--ok-bg:#1c3a1e;--ok-fg:#b7e39b;--roi-blue:#15303d;--roi-green:#1b3020;\n--glass:rgba(17,31,39,.78);--glass-2:rgba(17,31,39,.93);--glass-line:rgba(60,89,103,.55);--back:rgba(17,31,39,.55);}}\n:root[data-theme=\"dark\"]{color-scheme:dark;\n--bg:#09151b;--surface:#111f27;--surface-2:#15262f;--surface-3:#0d1a21;--hover:#1b2f39;\n--ink:#e8f1f5;--ink-2:#a9bdc6;--ink-3:#c1d0d7;--ink-4:#8fa4ae;\n--line:#26393f;--line-2:#1e303a;--line-3:#33505c;--line-4:#3c5967;\n--blue-text:#86cdf0;--blue-ink:#5cb7e4;--green-text:#a6d982;\n--tint-blue:#15303d;--tint-green:#1b3020;--tint-band:#0d202a;--tab-bg:#17292f;--input:#0c1920;\n--ink-fill:#e8f1f5;--ink-fill-text:#0d1f28;--ink-fill-hover:#ffffff;\n--deep:#0f232d;--deep-2:#183542;\n--warn-bg:#3b3011;--warn-fg:#f3d47e;--flag-bg:#432019;--flag-fg:#f6b5a8;--ok-bg:#1c3a1e;--ok-fg:#b7e39b;--roi-blue:#15303d;--roi-green:#1b3020;\n--glass:rgba(17,31,39,.78);--glass-2:rgba(17,31,39,.93);--glass-line:rgba(60,89,103,.55);--back:rgba(17,31,39,.55);}\n:root[data-theme=\"light\"]{color-scheme:light}\n@keyframes cw-pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}\n@keyframes cw-pulse{0%{box-shadow:0 0 0 0 rgba(24,120,164,.5)}70%,100%{box-shadow:0 0 0 7px rgba(24,120,164,0)}}\n@keyframes cw-dash{to{background-position:12px 0}}\n@keyframes cw-dashv{to{background-position:0 12px}}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}\n\n/* buttons: primary = filled, secondary = outlined, tertiary = text + arrow */\n.cw-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:99px;border:1.5px solid transparent;font:700 16px/1 'DM Sans',sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;box-sizing:border-box;transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s,transform .2s}\n.cw-btn .arr,.cw-tile .arr{display:inline-block;transition:transform .2s}\n.cw-btn:hover .arr,.cw-tile:hover .arr{transform:translateX(5px)}\n.cw-btn:active{transform:translateY(1px)}\n.cw-btn-lg{min-height:60px;padding:0 32px;font-size:17px}\n.cw-btn-sm{min-height:44px;padding:0 22px;font-size:15px}\n.cw-btn-primary,.cw-btn-blue{background:var(--cw-blue);color:#fff}\n.cw-btn-primary:hover,.cw-btn-blue:hover{background:var(--cw-blue-600);color:#fff;box-shadow:0 12px 24px -12px rgba(24,120,164,.8)}\n.cw-btn-green{background:var(--cw-green-600);color:#fff}\n.cw-btn-green:hover{background:var(--cw-green-700);color:#fff;box-shadow:0 12px 24px -12px rgba(77,130,48,.8)}\n.cw-btn-ink{background:var(--ink-fill);color:var(--ink-fill-text)}\n.cw-btn-ink:hover{background:var(--ink-fill-hover);color:var(--ink-fill-text)}\n.cw-btn-secondary{border-color:var(--ink);color:var(--ink);background:transparent}\n.cw-btn-secondary:hover{border-color:var(--blue-ink);color:var(--blue-text);background:var(--surface)}\n.cw-btn-inverse{background:#fff;color:var(--cw-blue-700)}\n.cw-btn-inverse:hover{background:#e6f1f6;color:var(--cw-blue-700);box-shadow:0 12px 24px -12px rgba(0,0,0,.35)}\n.cw-tile{flex:1 1 320px;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:96px;padding:0 32px;border-radius:28px;border:1px solid transparent;font:800 28px 'Bricolage Grotesque',sans-serif;letter-spacing:-.01em;text-decoration:none;transition:background-color .2s,border-color .2s,color .2s,transform .2s,box-shadow .2s}\n.cw-tile:hover{transform:translateY(-2px)}\n.cw-tile-blue{background:var(--cw-blue);color:#fff}\n.cw-tile-blue:hover{background:var(--cw-blue-600);color:#fff;box-shadow:0 20px 36px -20px rgba(24,120,164,.9)}\n.cw-tile-green{background:var(--cw-green-600);color:#fff}\n.cw-tile-green:hover{background:var(--cw-green-700);color:#fff;box-shadow:0 20px 36px -20px rgba(77,130,48,.9)}\n.cw-tile-out{background:var(--surface);border-color:var(--line);color:var(--ink)}\n.cw-tile-out.to-blue:hover{border-color:var(--cw-blue);color:var(--blue-text);background:var(--surface)}\n.cw-tile-out.to-green:hover{border-color:var(--cw-green-600);color:var(--green-text);background:var(--surface)}\n\n/* header */\n.cw-hdr{display:flex;align-items:center;gap:12px 20px;padding:10px 10px 10px 28px;min-height:68px;box-sizing:border-box;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border:1px solid var(--glass-line);box-shadow:0 1px 2px rgba(13,42,58,.04);transition:box-shadow .25s,background-color .25s}\n.cw-hdr.sc{background:var(--glass-2);box-shadow:0 16px 36px -16px rgba(13,42,58,.3)}\n.cw-nav{margin-left:auto;display:flex;align-items:center;gap:2px;font-size:clamp(13.5px,1.3vw,15px);font-weight:500;white-space:nowrap}\n.cw-navi{position:relative;display:inline-flex;align-items:center;min-height:42px;border-radius:99px;color:var(--ink-3);text-decoration:none;transition:background-color .2s,color .2s}\na.cw-navi{padding:0 clamp(10px,1.2vw,15px)}\n.cw-navgrp>a{display:inline-flex;align-items:center;min-height:42px;padding:0 0 0 clamp(10px,1.2vw,15px);color:inherit;text-decoration:none}\n.cw-navgrp>a:hover{color:inherit}\n.cw-navi:hover{background:var(--hover);color:var(--blue-text)}\n.cw-navi.on{background:var(--tint-blue);color:var(--blue-text);font-weight:700}\n.cw-chev{display:inline-grid;place-items:center;width:32px;height:42px;padding:0 8px 0 2px;background:none;border:0;color:inherit;cursor:pointer;border-radius:0 99px 99px 0;box-sizing:border-box}\n.cw-chev svg{transition:transform .2s}\n.cw-chev.open svg{transform:rotate(180deg)}\n.cw-dd{position:relative}\n.cw-menu-wrap{position:absolute;top:100%;padding-top:10px;z-index:60}\n.cw-menu{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:0 26px 50px -18px rgba(13,42,58,.32),0 2px 6px rgba(13,42,58,.06);animation:cw-pop .18s ease-out;transform-origin:top left}\n.cw-mi{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:500;transition:background-color .15s,color .15s}\n.cw-mi:hover{background:var(--hover);color:var(--ink)}\n.cw-mi.on{background:var(--tint-blue)}\n.cw-mi .arr{margin-left:auto;color:var(--ink-4);transition:transform .2s,color .2s}\n.cw-mi:hover .arr{color:var(--blue-ink);transform:translateX(4px)}\n.cw-sw{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#fff;font:800 18px 'Bricolage Grotesque',sans-serif}\n.cw-mt{display:flex;flex-direction:column;gap:2px;min-width:0}\n.cw-mt b{font-size:15.5px;font-weight:700}\n.cw-mt small{font-size:13.5px;color:var(--ink-2);line-height:1.35;white-space:normal;font-weight:400}\n.cw-mi-all{margin-top:6px;padding-top:14px;border-top:1px solid var(--line-2);border-radius:0 0 14px 14px}\n.cw-burger{margin-left:auto;width:46px;height:46px;border-radius:50%;border:1px solid var(--line-3);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:border-color .2s,color .2s}\n.cw-burger:hover{border-color:var(--cw-blue);color:var(--blue-text)}\n.cw-mnav a.cw-ml{display:flex;align-items:center;min-height:44px;border-bottom:1px solid var(--line-2);color:var(--ink);text-decoration:none}\n.cw-mnav a.cw-ml:hover{color:var(--cw-blue-700)}\n\n/* home hero: app window */\n.cw-stage{position:relative;padding:0 0 30px}\n.cw-glow{position:absolute;inset:-56px -40px -20px -48px;background:linear-gradient(120deg,rgba(24,120,164,.2),rgba(92,144,60,.18));-webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);z-index:0;pointer-events:none}\n.cw-back{position:absolute;left:18px;right:-18px;top:18px;bottom:48px;border-radius:22px;background:var(--back);border:1px solid var(--line);z-index:0}\n.cw-win{padding-bottom:34px;position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 1px 0 rgba(13,42,58,.03),0 34px 60px -24px rgba(13,42,58,.32),0 12px 24px -12px rgba(13,42,58,.12)}\n.cw-bar{display:flex;align-items:center;gap:14px;padding:13px 18px;background:var(--surface-2);border-bottom:1px solid var(--line-2)}\n.cw-dots{display:flex;gap:7px;flex:none}\n.cw-dots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}\n.cw-wt{font-size:13px;font-weight:500;color:var(--ink-2);min-width:0}\n.cw-seg{display:flex;gap:5px;padding:18px 22px 6px}\n.cw-seg i{flex:1;height:5px;border-radius:5px;background:var(--line)}\n.cw-seg i.done{background:var(--cw-green-600)}.cw-seg i.run{background:var(--cw-blue)}.cw-seg i.ready{background:var(--cw-green)}\n.cw-steps{padding:4px 22px 6px}\n.cw-step{position:relative;display:flex;align-items:center;gap:14px;padding:9px 0;font-size:16px;font-weight:500}\n.cw-step:not(:last-child)::after{content:\"\";position:absolute;left:15px;top:calc(100% - 9px);height:18px;width:2px;background:var(--line-2)}\n.cw-step>span:nth-child(2){flex:1;min-width:0}\n.cw-node{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:700;border:1.5px solid var(--line-3);color:var(--ink-4);background:var(--surface);box-sizing:border-box}\n.cw-node.done{background:var(--cw-green-600);border-color:var(--cw-green-600);color:#fff}\n.cw-node.run{border-color:var(--cw-blue);color:var(--cw-blue-700);background:var(--tint-blue)}\n.cw-node.ready{border-color:var(--cw-green-600);color:var(--cw-green-700);background:var(--tint-green)}\n.cw-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:99px;font-size:12px
