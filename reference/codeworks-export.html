-tab-bg:#17292f;--input:#0c1920;\n--ink-fill:#e8f1f5;--ink-fill-text:#0d1f28;--ink-fill-hover:#ffffff;\n--deep:#0f232d;--deep-2:#183542;\n--warn-bg:#3b3011;--warn-fg:#f3d47e;--flag-bg:#432019;--flag-fg:#f6b5a8;--ok-bg:#1c3a1e;--ok-fg:#b7e39b;--roi-blue:#15303d;--roi-green:#1b3020;\n--glass:rgba(17,31,39,.78);--glass-2:rgba(17,31,39,.93);--glass-line:rgba(60,89,103,.55);--back:rgba(17,31,39,.55);}}\n:root[data-theme=\"dark\"]{color-scheme:dark;\n--bg:#09151b;--surface:#111f27;--surface-2:#15262f;--surface-3:#0d1a21;--hover:#1b2f39;\n--ink:#e8f1f5;--ink-2:#a9bdc6;--ink-3:#c1d0d7;--ink-4:#8fa4ae;\n--line:#26393f;--line-2:#1e303a;--line-3:#33505c;--line-4:#3c5967;\n--blue-text:#86cdf0;--blue-ink:#5cb7e4;--green-text:#a6d982;\n--tint-blue:#15303d;--tint-green:#1b3020;--tint-band:#0d202a;--tab-bg:#17292f;--input:#0c1920;\n--ink-fill:#e8f1f5;--ink-fill-text:#0d1f28;--ink-fill-hover:#ffffff;\n--deep:#0f232d;--deep-2:#183542;\n--warn-bg:#3b3011;--warn-fg:#f3d47e;--flag-bg:#432019;--flag-fg:#f6b5a8;--ok-bg:#1c3a1e;--ok-fg:#b7e39b;--roi-blue:#15303d;--roi-green:#1b3020;\n--glass:rgba(17,31,39,.78);--glass-2:rgba(17,31,39,.93);--glass-line:rgba(60,89,103,.55);--back:rgba(17,31,39,.55);}\n:root[data-theme=\"light\"]{color-scheme:light}\n@keyframes cw-pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}\n@keyframes cw-pulse{0%{box-shadow:0 0 0 0 rgba(24,120,164,.5)}70%,100%{box-shadow:0 0 0 7px rgba(24,120,164,0)}}\n@keyframes cw-dash{to{background-position:12px 0}}\n@keyframes cw-dashv{to{background-position:0 12px}}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}\n\n/* buttons: primary = filled, secondary = outlined, tertiary = text + arrow */\n.cw-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:99px;border:1.5px solid transparent;font:700 16px/1 'DM Sans',sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;box-sizing:border-box;transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s,transform .2s}\n.cw-btn .arr,.cw-tile .arr{display:inline-block;transition:transform .2s}\n.cw-btn:hover .arr,.cw-tile:hover .arr{transform:translateX(5px)}\n.cw-btn:active{transform:translateY(1px)}\n.cw-btn-lg{min-height:60px;padding:0 32px;font-size:17px}\n.cw-btn-sm{min-height:44px;padding:0 22px;font-size:15px}\n.cw-btn-primary,.cw-btn-blue{background:var(--cw-blue);color:#fff}\n.cw-btn-primary:hover,.cw-btn-blue:hover{background:var(--cw-blue-600);color:#fff;box-shadow:0 12px 24px -12px rgba(24,120,164,.8)}\n.cw-btn-green{background:var(--cw-green-600);color:#fff}\n.cw-btn-green:hover{background:var(--cw-green-700);color:#fff;box-shadow:0 12px 24px -12px rgba(77,130,48,.8)}\n.cw-btn-ink{background:var(--ink-fill);color:var(--ink-fill-text)}\n.cw-btn-ink:hover{background:var(--ink-fill-hover);color:var(--ink-fill-text)}\n.cw-btn-secondary{border-color:var(--ink);color:var(--ink);background:transparent}\n.cw-btn-secondary:hover{border-color:var(--blue-ink);color:var(--blue-text);background:var(--surface)}\n.cw-btn-inverse{background:#fff;color:var(--cw-blue-700)}\n.cw-btn-inverse:hover{background:#e6f1f6;color:var(--cw-blue-700);box-shadow:0 12px 24px -12px rgba(0,0,0,.35)}\n.cw-tile{flex:1 1 320px;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:96px;padding:0 32px;border-radius:28px;border:1px solid transparent;font:800 28px 'Bricolage Grotesque',sans-serif;letter-spacing:-.01em;text-decoration:none;transition:background-color .2s,border-color .2s,color .2s,transform .2s,box-shadow .2s}\n.cw-tile:hover{transform:translateY(-2px)}\n.cw-tile-blue{background:var(--cw-blue);color:#fff}\n.cw-tile-blue:hover{background:var(--cw-blue-600);color:#fff;box-shadow:0 20px 36px -20px rgba(24,120,164,.9)}\n.cw-tile-green{background:var(--cw-green-600);color:#fff}\n.cw-tile-green:hover{background:var(--cw-green-700);color:#fff;box-shadow:0 20px 36px -20px rgba(77,130,48,.9)}\n.cw-tile-out{background:var(--surface);border-color:var(--line);color:var(--ink)}\n.cw-tile-out.to-blue:hover{border-color:var(--cw-blue);color:var(--blue-text);background:var(--surface)}\n.cw-tile-out.to-green:hover{border-color:var(--cw-green-600);color:var(--green-text);background:var(--surface)}\n\n/* header */\n.cw-hdr{display:flex;align-items:center;gap:12px 20px;padding:10px 10px 10px 28px;min-height:68px;box-sizing:border-box;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border:1px solid var(--glass-line);box-shadow:0 1px 2px rgba(13,42,58,.04);transition:box-shadow .25s,background-color .25s}\n.cw-hdr.sc{background:var(--glass-2);box-shadow:0 16px 36px -16px rgba(13,42,58,.3)}\n.cw-nav{margin-left:auto;display:flex;align-items:center;gap:2px;font-size:clamp(13.5px,1.3vw,15px);font-weight:500;white-space:nowrap}\n.cw-navi{position:relative;display:inline-flex;align-items:center;min-height:42px;border-radius:99px;color:var(--ink-3);text-decoration:none;transition:background-color .2s,color .2s}\na.cw-navi{padding:0 clamp(10px,1.2vw,15px)}\n.cw-navgrp>a{display:inline-flex;align-items:center;min-height:42px;padding:0 0 0 clamp(10px,1.2vw,15px);color:inherit;text-decoration:none}\n.cw-navgrp>a:hover{color:inherit}\n.cw-navi:hover{background:var(--hover);color:var(--blue-text)}\n.cw-navi.on{background:var(--tint-blue);color:var(--blue-text);font-weight:700}\n.cw-chev{display:inline-grid;place-items:center;width:32px;height:42px;padding:0 8px 0 2px;background:none;border:0;color:inherit;cursor:pointer;border-radius:0 99px 99px 0;box-sizing:border-box}\n.cw-chev svg{transition:transform .2s}\n.cw-chev.open svg{transform:rotate(180deg)}\n.cw-dd{position:relative}\n.cw-menu-wrap{position:absolute;top:100%;padding-top:10px;z-index:60}\n.cw-menu{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:0 26px 50px -18px rgba(13,42,58,.32),0 2px 6px rgba(13,42,58,.06);animation:cw-pop .18s ease-out;transform-origin:top left}\n.cw-mi{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:500;transition:background-color .15s,color .15s}\n.cw-mi:hover{background:var(--hover);color:var(--ink)}\n.cw-mi.on{background:var(--tint-blue)}\n.cw-mi .arr{margin-left:auto;color:var(--ink-4);transition:transform .2s,color .2s}\n.cw-mi:hover .arr{color:var(--blue-ink);transform:translateX(4px)}\n.cw-sw{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#fff;font:800 18px 'Bricolage Grotesque',sans-serif}\n.cw-mt{display:flex;flex-direction:column;gap:2px;min-width:0}\n.cw-mt b{font-size:15.5px;font-weight:700}\n.cw-mt small{font-size:13.5px;color:var(--ink-2);line-height:1.35;white-space:normal;font-weight:400}\n.cw-mi-all{margin-top:6px;padding-top:14px;border-top:1px solid var(--line-2);border-radius:0 0 14px 14px}\n.cw-burger{margin-left:auto;width:46px;height:46px;border-radius:50%;border:1px solid var(--line-3);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:border-color .2s,color .2s}\n.cw-burger:hover{border-color:var(--cw-blue);color:var(--blue-text)}\n.cw-mnav a.cw-ml{display:flex;align-items:center;min-height:44px;border-bottom:1px solid var(--line-2);color:var(--ink);text-decoration:none}\n.cw-mnav a.cw-ml:hover{color:var(--cw-blue-700)}\n\n/* home hero: app window */\n.cw-stage{position:relative;padding:0 0 30px}\n.cw-glow{position:absolute;inset:-56px -40px -20px -48px;background:linear-gradient(120deg,rgba(24,120,164,.2),rgba(92,144,60,.18));-webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);z-index:0;pointer-events:none}\n.cw-back{position:absolute;left:18px;right:-18px;top:18px;bottom:48px;border-radius:22px;background:var(--back);border:1px solid var(--line);z-index:0}\n.cw-win{padding-bottom:34px;position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 1px 0 rgba(13,42,58,.03),0 34px 60px -24px rgba(13,42,58,.32),0 12px 24px -12px rgba(13,42,58,.12)}\n.cw-bar{display:flex;align-items:center;gap:14px;padding:13px 18px;background:var(--surface-2);border-bottom:1px solid var(--line-2)}\n.cw-dots{display:flex;gap:7px;flex:none}\n.cw-dots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}\n.cw-wt{font-size:13px;font-weight:500;color:var(--ink-2);min-width:0}\n.cw-seg{display:flex;gap:5px;padding:18px 22px 6px}\n.cw-seg i{flex:1;height:5px;border-radius:5px;background:var(--line)}\n.cw-seg i.done{background:var(--cw-green-600)}.cw-seg i.run{background:var(--cw-blue)}.cw-seg i.ready{background:var(--cw-green)}\n.cw-steps{padding:4px 22px 6px}\n.cw-step{position:relative;display:flex;align-items:center;gap:14px;padding:9px 0;font-size:16px;font-weight:500}\n.cw-step:not(:last-child)::after{content:\"\";position:absolute;left:15px;top:calc(100% - 9px);height:18px;width:2px;background:var(--line-2)}\n.cw-step>span:nth-child(2){flex:1;min-width:0}\n.cw-node{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:700;border:1.5px solid var(--line-3);color:var(--ink-4);background:var(--surface);box-sizing:border-box}\n.cw-node.done{background:var(--cw-green-600);border-color:var(--cw-green-600);color:#fff}\n.cw-node.run{border-color:var(--cw-blue);color:var(--cw-blue-700);background:var(--tint-blue)}\n.cw-node.ready{border-color:var(--cw-green-600);color:var(--cw-green-700);background:var(--tint-green)}\n.cw-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:none;white-space:nowrap}\n.cw-pill i{width:7px;height:7px;border-radius:50%;background:currentColor}\n.cw-pill.done,.cw-pill.ready{background:var(--tint-green);color:var(--green-text)}\n.cw-pill.run{background:var(--tint-blue);color:var(--blue-text)}\n.cw-pill.run i{background:var(--cw-blue);animation:cw-pulse 1.6s ease-out infinite}\n.cw-pill.queue{background:var(--hover);color:var(--ink-4)}\n.cw-risks{margin:8px 14px 14px;padding:8px;border-radius:16px;background:var(--surface-3);display:grid;gap:6px}\n.cw-risk{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 14px}\n.cw-tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;flex:none}\n.cw-float{position:absolute;left:-40px;bottom:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;width:min(390px,100%);box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 16px;font-size:14.5px;box-shadow:0 22px 40px -16px rgba(13,42,58,.38),0 4px 10px rgba(13,42,58,.06)}\n@media (max-width:1180px){.cw-win{padding-bottom:0}.cw-float{position:relative;left:0;margin-top:12px;width:100%}.cw-back{display:none}.cw-stage{padding-bottom:0}}\n\n/* home product tiles + trust row */\n.cw-prod{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:176px;padding:30px 32px;border-radius:28px;color:#fff;text-decoration:none;transition:transform .25s,box-shadow .25s}\n.cw-prod::after{content:\"\";position:absolute;right:-70px;bottom:-90px;width:270px;height:270px;border-radius:50%;border:38px solid rgba(255,255,255,.07);pointer-events:none;transition:transform .5s}\n.cw-prod>*{position:relative;z-index:1}\n.cw-prod:hover{transform:translateY "/>\u003ccircle cx=\"196\" cy=\"88\" r=\"7\" fill=\"#e5533d\"/>\u003cpath d=\"M262 50l4 4 8-9\" stroke=\"#1878a4\" stroke-width=\"2.6\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/sc-if>\u003csc-if value=\"{{ p.isS }}\" hint-placeholder-val=\"{{ false }}\">\u003csvg class=\"tv\" viewBox=\"0 0 320 170\" aria-hidden=\"true\">\u003cg fill=\"#fff\" fill-opacity=\".16\">\u003crect x=\"10\" y=\"30\" width=\"62\" height=\"110\" rx=\"10\"/>\u003crect x=\"92\" y=\"30\" width=\"62\" height=\"110\" rx=\"10\"/>\u003crect x=\"174\" y=\"30\" width=\"62\" height=\"110\" rx=\"10\"/>\u003crect x=\"256\" y=\"30\" width=\"54\" height=\"110\" rx=\"10\"/>\u003c/g>\u003cg fill=\"#fff\" fill-opacity=\".85\">\u003crect x=\"20\" y=\"46\" width=\"42\" height=\"8\" rx=\"4\"/>\u003crect x=\"20\" y=\"64\" width=\"34\" height=\"8\" rx=\"4\"/>\u003crect x=\"20\" y=\"82\" width=\"42\" height=\"8\" rx=\"4\"/>\u003crect x=\"102\" y=\"46\" width=\"22\" height=\"8\" rx=\"4\"/>\u003crect x=\"130\" y=\"46\" width=\"14\" height=\"8\" rx=\"4\"/>\u003crect x=\"102\" y=\"70\" width=\"22\" height=\"8\" rx=\"4\"/>\u003crect x=\"130\" y=\"70\" width=\"14\" height=\"8\" rx=\"4\"/>\u003crect x=\"102\" y=\"94\" width=\"42\" height=\"8\" rx=\"4\"/>\u003ccircle cx=\"190\" cy=\"52\" r=\"5\"/>\u003ccircle cx=\"190\" cy=\"82\" r=\"5\"/>\u003ccircle cx=\"190\" cy=\"112\" r=\"5\"/>\u003crect x=\"204\" y=\"48\" width=\"24\" height=\"8\" rx=\"4\"/>\u003crect x=\"204\" y=\"78\" width=\"24\" height=\"8\" rx=\"4\"/>\u003crect x=\"204\" y=\"108\" width=\"24\" height=\"8\" rx=\"4\"/>\u003crect x=\"266\" y=\"46\" width=\"34\" height=\"8\" rx=\"4\"/>\u003crect x=\"266\" y=\"70\" width=\"34\" height=\"8\" rx=\"4\"/>\u003c/g>\u003cg stroke=\"#fff\" stroke-opacity=\".7\" stroke-width=\"1.6\" fill=\"none\" class=\"flowline\">\u003cpath d=\"M74 85 L90 85\"/>\u003cpath d=\"M156 85 L172 85\"/>\u003cpath d=\"M238 85 L254 85\"/>\u003c/g>\u003crect x=\"10\" y=\"152\" width=\"300\" height=\"5\" rx=\"3\" fill=\"#fff\" fill-opacity=\".2\"/>\u003crect x=\"10\" y=\"152\" width=\"230\" height=\"5\" rx=\"3\" fill=\"#fff\" class=\"prog\"/>\u003c/svg>\u003c/sc-if>\u003c/span>\u003c/a>\u003c/sc-for>\n\u003c/section>\n\n\u003csection class=\"cw-trust cw-bleed\">\n  \u003cdiv>\u003cdiv style=\"font:800 56px/1 'Bricolage Grotesque';color:var(--blue-ink);letter-spacing:-0.04em\">30+\u003c/div>\u003cdiv style=\"font-weight:500\">Years Telecom-Grade Legacy\u003c/div>\u003c/div>\n  \u003csc-for list=\"{{ trust }}\" as=\"t\" hint-placeholder-count=\"3\">\u003cdiv>\u003cspan style=\"width:36px;height:5px;border-radius:9px;background:{{ t.c }}\">\u003c/span>\u003cb style=\"font:700 21px/1.15 'Bricolage Grotesque'\">{{ t.t }}\u003c/b>\u003c/div>\u003c/sc-for>\n\u003c/section>\n\n\u003csection style=\"margin-top:64px;background:#1878a4;color:#fff;border-radius:32px;padding:clamp(32px,5vw,56px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px 32px\">\n  \u003ch2 style=\"margin:0;font:800 clamp(34px,4.6vw,56px)/1 'Bricolage Grotesque';letter-spacing:-0.04em;max-width:14ch\">Schedule a Demo\u003c/h2>\n  \u003ca class=\"cw-btn cw-btn-inverse cw-btn-lg\" href=\"Codeworks%20Contact.dc.html\">Talk to Us \u003cspan class=\"arr\">→\u003c/span>\u003c/a>\n\u003c/section>\n\u003cdc-import name=\"CW Footer\" hint-size=\"100%,64px\">\u003c/dc-import>\n\u003c/div>\n\u003c/div>\n\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script>\nclass Component extends DCLogic {\n  renderVals() {\n    const A = [['01', 'Document Verification', 'Complete', 'done'], ['02', 'Investigation', 'Running', 'run'], ['03', 'Credit Assessment Report', 'Queued', 'queue'], ['04', 'Credit Copilot', 'Ready', 'ready']];\n    const R = [\n      { text: 'Inconsistency across submitted documents', tag: 'Review', bg: 'var(--warn-bg)', fg: 'var(--warn-fg)' },\n      { text: 'Unexplained link between related entities', tag: 'Flag', bg: 'var(--flag-bg)', fg: 'var(--flag-fg)' },\n      { text: 'Income evidence matches declared profile', tag: 'Clear', bg: 'var(--ok-bg)', fg: 'var(--ok-fg)' }\n    ];\n    return {\n      trust: [{ t: 'High-Volume Resilience', c: '#1878a4' }, { t: 'Zero Rip-&-Replace', c: '#5c903c' }, { t: 'Audit-Ready', c: '#1878a4' }],\n      prods: [{ name: 'Drishti.ai', desc: 'AI credit assessment & investigation', bg: '#1878a4', isD: true, isS: false, href: 'Drishti%20Product.dc.html' }, { name: 'Spectra', desc: 'Subvention claims tracing, reconciliation & audit', bg: '#4d8230', isD: false, isS: true, href: 'Spectra%20Product.dc.html' }],\n      agents: A.map(a => ({ n: a[0], name: a[1], status: a[2], kind: a[3] })),\n      risksIn: R.slice(0, 2), riskOut: R.slice(2)\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Codeworks Company.dc.html":"\u003c!DOCTYPE html>\n\u003chtml>\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>body{margin:0;background:var(--bg)}:focus-visible{outline:2px solid #1878a4;outline-offset:2px}a{color:var(--blue-text)}a:hover{color:var(--blue-ink)}\n:root{color-scheme:light;--cw-blue:#1878a4;--cw-blue-600:#125f82;--cw-blue-700:#0b4a66;--cw-green:#5c903c;--cw-green-600:#4d8230;--cw-green-700:#3d6522;\n--bg:#f1f6f8;--surface:#ffffff;--surface-2:#f5f9fb;--surface-3:#f3f8fa;--hover:#eef4f7;\n--ink:#0d1f28;--ink-2:#485c65;--ink-3:#33474f;--ink-4:#5a6d76;\n--line:#d4e1e7;--line-2:#e3ecf0;--line-3:#c3d6df;--line-4:#b9c8cf;\n--blue-text:#0b5577;--blue-ink:#1878a4;--green-text:#3d6522;\n--tint-blue:#e0eef5;--tint-green:#e3eed9;--tint-band:#e7f0f4;--tab-bg:#e2ebf0;--input:#f7fafb;\n--ink-fill:#0d1f28;--ink-fill-text:#ffffff;--ink-fill-hover:#1c3541;\n--deep:#0d1f28;--deep-2:#152f3b;\n--warn-bg:#f6dfa8;--warn-fg:#5c3f00;--flag-bg:#f3c4bc;--flag-fg:#7a1f12;--ok-bg:#cfe5bd;--ok-fg:#2f5219;--roi-blue:#e0eef5;--roi-green:#e6f0dc;\n--glass:rgba(255,255,255,.8);--glass-2:rgba(255,255,255,.93);--glass-line:rgba(207,221,228,.9);--back:rgba(255,255,255,.55);}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){color-scheme:dark;\n--bg:#09151b;--surface:#111f27;--surface-2:#15262f;--surface-3:#0d1a21;--hover:#1b2f39;\n--ink:#e8f1f5;--ink-2:#a9bdc6;--ink-3:#c1d0d7;--ink-4:#8fa4ae;\n--line:#26393f;--line-2:#1e303a;--line-3:#33505c;--line-4:#3c5967;\n--blue-text:#86cdf0;--blue-ink:#5cb7e4;--green-text:#a6d982;\n--tint-blue:#15303d;--tint-green:#1b3020;--tint-band:#0d202a;--tab-bg:#17292f;--input:#0c1920;\n--ink-fill:#e8f1f5;--ink-fill-text:#0d1f28;--ink-fill-hover:#ffffff;\n--deep:#0f232d;--deep-2:#183542;\n--warn-bg:#3b3011;--warn-fg:#f3d47e;--flag-bg:#432019;--flag-fg:#f6b5a8;--ok-bg:#1c3a1e;--ok-fg:#b7e39b;--roi-blue:#15303d;--roi-green:#1b3020;\n--glass:rgba(17,31,39,.78);--glass-2:rgba(17,31,39,.93);--glass-line:rgba(60,89,103,.55);--back:rgba(17,31,39,.55);}}\n:root[data-theme=\"dark\"]{color-scheme:dark;\n--bg:#09151b;--surface:#111f27;--surface-2:#15262f;--surface-3:#0d1a21;--hover:#1b2f39;\n--ink:#e8f1f5;--ink-2:#a9bdc6;--ink-3:#c1d0d7;--ink-4:#8fa4ae;\n--line:#26393f;--line-2:#1e303a;--line-3:#33505c;--line-4:#3c5967;\n--blue-text:#86cdf0;--blue-ink:#5cb7e4;--green-text:#a6d982;\n--tint-blue:#15303d;--tint-green:#1b3020;--tint-band:#0d202a;--tab-bg:#17292f;--input:#0c1920;\n--ink-fill:#e8f1f5;--ink-fill-text:#0d1f28;--ink-fill-hover:#ffffff;\n--deep:#0f232d;--deep-2:#183542;\n--warn-bg:#3b3011;--warn-fg:#f3d47e;--flag-bg:#432019;--flag-fg:#f6b5a8;--ok-bg:#1c3a1e;--ok-fg:#b7e39b;--roi-blue:#15303d;--roi-green:#1b3020;\n--glass:rgba(17,31,39,.78);--glass-2:rgba(17,31,39,.93);--glass-line:rgba(60,89,103,.55);--back:rgba(17,31,39,.55);}\n:root[data-theme=\"light\"]{color-scheme:light}\n@keyframes cw-pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}\n@keyframes cw-pulse{0%{box-shadow:0 0 0 0 rgba(24,120,164,.5)}70%,100%{box-shadow:0 0 0 7px rgba(24,120,164,0)}}\n@keyframes cw-dash{to{background-position:12px 0}}\n@keyframes cw-dashv{to{background-position:0 12px}}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}\n\n/* buttons: primary = filled, secondary = outlined, tertiary = text + arrow */\n.cw-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:99px;border:1.5px solid transparent;font:700 16px/1 'DM Sans',sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;box-sizing:border-box;transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s,transform .2s}\n.cw-btn .arr,.cw-tile .arr{display:inline-block;transition:transform .2s}\n.cw-btn:hover .arr,.cw-tile:hover .arr{transform:translateX(5px)}\n.cw-btn:active{transform:translateY(1px)}\n.cw-btn-lg{min-height:60px;padding:0 32px;font-size:17px}\n.cw-btn-sm{min-height:44px;padding:0 22px;font-size:15px}\n.cw-btn-primary,.cw-btn-blue{background:var(--cw-blue);color:#fff}\n.cw-btn-primary:hover,.cw-btn-blue:hover{background:var(--cw-blue-600);color:#fff;box-shadow:0 12px 24px -12px rgba(24,120,164,.8)}\n.cw-btn-green{background:var(--cw-green-600);color:#fff}\n.cw-btn-green:hover{background:var(--cw-green-700);color:#fff;box-shadow:0 12px 24px -12px rgba(77,130,48,.8)}\n.cw-btn-ink{background:var(--ink-fill);color:var(--ink-fill-text)}\n.cw-btn-ink:hover{background:var(--ink-fill-hover);color:var(--ink-fill-text)}\n.cw-btn-secondary{border-color:var(--ink);color:var(--ink);background:transparent}\n.cw-btn-secondary:hover{border-color:var(--blue-ink);color:var(--blue-text);background:var(--surface)}\n.cw-btn-inverse{backg rder-top-color:var(--cw-green-600)}\n.cw-open .k{font-size:13px;letter-spacing:.12em;color:var(--blue-text)}.cw-open.acc-green .k{color:var(--green-text)}\n.cw-open .t{font:700 22px/1.12 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}\n.cw-open .d{margin-top:10px;font-size:16px;line-height:1.55;color:var(--ink-2);max-width:44ch}\n/* editorial tabs + rows */\n.cw-etabs{display:flex;gap:clamp(20px,3.2vw,44px);border-bottom:1px solid var(--line-3);overflow-x:auto;scrollbar-width:none;padding-bottom:0}\n.cw-et{position:relative;flex:none;cursor:pointer;background:none;border:0;padding:14px 0 16px;font:700 clamp(17px,1.6vw,21px)/1.1 'Bricolage Grotesque',sans-serif;letter-spacing:-.015em;color:var(--ink-4);white-space:nowrap;transition:color .2s}\n.cw-et::after{content:\"\";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px;background:var(--cw-blue);transform:scaleX(0);transform-origin:left;transition:transform .3s}\n.cw-et:hover{color:var(--ink)}.cw-et[aria-selected=\"true\"]{color:var(--ink)}.cw-et[aria-selected=\"true\"]::after{transform:scaleX(1)}\n.cw-rows{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));column-gap:56px}\n.cw-row{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding:26px 0;border-top:1px solid var(--line-3);transition:border-color .25s}\n.cw-row:hover{border-top-color:var(--acc)}\n.cw-row .t{font:700 clamp(20px,1.9vw,24px)/1.15 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}\n.cw-row .d{margin-top:8px;font-size:16px;line-height:1.5;color:var(--ink-2);max-width:48ch}\n.cw-row .d:empty{display:none}\n.cw-row .go{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px;font-weight:700;color:var(--acc);text-decoration:none;white-space:nowrap}\n.cw-row .go .arr{display:inline-block;transition:transform .2s}.cw-row .go:hover{text-decoration:underline}.cw-row .go:hover .arr{transform:translate(4px,-4px)}\n@media (max-width:560px){.cw-row{flex-direction:column;gap:6px}}\n/* press states + arrow language */\n.cw-btn:active,.cw-tile:active,.cw-prod:active,.cw-ag:active{transform:translateY(1px)!important}\na:hover>.arr,a:hover .arr{transform:translateX(5px)}.arr{display:inline-block;transition:transform .2s}\n.cw-row .go:hover .arr{transform:translate(4px,-4px)}\n.cw-nav div.cw-dd:first-of-type .cw-navgrp>a{font-weight:700}\np{max-width:72ch}\n/* mega-menu thumbnails */\n.cw-mth{flex:none;width:64px;height:50px;border-radius:10px;display:grid;place-items:center;overflow:hidden}\n.cw-mth svg{width:100%;height:100%;display:block}\n/* CTA band + open band texture */\n.cw-band{position:relative}\n.cw-vst:not(:last-child)::after{width:28px;height:28px;right:-28px;font-size:14px}\n.cw-vrow{counter-reset:vs}.cw-vh .n::before{counter-increment:vs;content:\"0\" counter(vs)}\n@media (max-width:700px){.cw-etabs{flex-wrap:wrap;overflow:visible;gap:0 22px}.cw-et{padding:12px 0 14px;font-size:17px}}\n@media (max-width:560px){.cw-ptabs{display:flex!important;width:100%;box-sizing:border-box;border-radius:26px!important}.cw-ptabs .cw-tab{flex:1 1 auto;padding:0 12px!important;white-space:nowrap;font-size:14px!important}}\n.cw-cat{margin:40px 0 0;font:800 clamp(30px,3.6vw,46px)/1.04 'Bricolage Grotesque',sans-serif;letter-spacing:-.035em}\n.cw-vh{min-height:40px}\n.cw-rcol p{max-width:60ch}\n.cw-rcol .cw-close{margin:26px 0 0;padding-top:22px;border-top:1px solid var(--line);font:500 19px/1.55 'DM Sans',sans-serif;color:var(--ink);max-width:60ch}\n.cw-rcol .cw-close em{font-style:normal;font-weight:700;color:var(--green-text)}\n\u003c/style>\n\u003c/helmet>\n\u003cdiv style=\"background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;padding:16px;box-sizing:border-box;overflow-x:clip;min-height:100vh\">\n\u003cdiv style=\"max-width:1240px;margin:0 auto\">\n\u003cdc-import name=\"CW Header\" active=\"company\" hint-size=\"100%,60px\" style=\"position:sticky;top:12px;z-index:50;display:block;margin-bottom:12px\">\u003c/dc-import>\n\n\u003csection class=\"cw-split2\" style=\"padding:clamp(40px,5vw,72px) clamp(8px,2.5vw,32px) clamp(36px,4vw,56px)\">\n  \u003cdiv>\u003cdiv style=\"font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-text)\">Company\u003c/div>\u003ch1 style=\"margin:16px 0 0;font:800 clamp(40px,5.2vw,72px)/1.02 'Bricolage Grotesque';letter-spacing:-0.04em\">Who We Are\u003c/h1>\u003c/div>\n  \u003cdiv style=\"font-size:clamp(17px,1.5vw,20px);line-height:1.6;color:var(--ink-2)\">\u003cp style=\"margin:0 0 18px;color:var(--ink);font-weight:500\">Codeworks is a technology product company building enterprise software for businesses where technology is central to operations.\u003c/p>\u003cp style=\"margin:0\">Our 30+ years of experience in telecom engineering, together with our expertise in AI, help us build stable, scalable and configurable software for banks, NBFCs and other enterprises. These are systems where uptime, fault tolerance and data integrity are non-negotiable.\u003c/p>\u003c/div>\n\u003c/section>\n\n\u003csection style=\"background:var(--deep);color:#fff;border-radius:32px;padding:clamp(28px,4vw,48px)\">\n  \u003cdiv style=\"font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#86be58\">What We Bring\u003c/div>\n  \u003ch2 style=\"margin:12px 0 0;font:800 clamp(28px,3.4vw,44px)/1.04 'Bricolage Grotesque';letter-spacing:-0.03em;max-width:20ch;text-wrap:balance\">Resilient. Scalable. Interoperable software products.\u003c/h2>\n  \u003cdiv style=\"margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px\">\n    \u003csc-for list=\"{{ bring }}\" as=\"b\" hint-placeholder-count=\"4\">\u003cdiv class=\"cw-rv\" style=\"background:var(--deep-2);border:1px solid #2a4a59;border-radius:22px;padding:22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:24px\">\u003cb style=\"font-size:13px;letter-spacing:.1em;color:#6cc2e8\">{{ b.n }}\u003c/b>\u003cdiv>\u003cdiv style=\"font:700 22px/1.1 'Bricolage Grotesque'\">{{ b.t }}\u003c/div>\u003cdiv style=\"margin-top:8px;font-size:15.5px;line-height:1.5;color:#a9bdc6\">{{ b.d }}\u003c/div>\u003c/div>\u003c/div>\u003c/sc-for>\n  \u003c/div>\n\u003c/section>\n\n\u003csection style=\"margin-top:56px;padding:0 clamp(8px,2.5vw,32px) 44px\">\n  \u003cdiv style=\"font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-text)\">How We Build\u003c/div>\n  \u003cdiv style=\"margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px\">\n    \u003csc-for list=\"{{ build }}\" as=\"b\" hint-placeholder-count=\"4\">\u003cdiv class=\"cw-open cw-rv\">\u003cb class=\"k\" style=\"color:{{ b.fg }}\">{{ b.n }}\u003c/b>\u003cdiv>\u003cdiv class=\"t\">{{ b.t }}\u003c/div>\u003cdiv class=\"d\">{{ b.d }}\u003c/div>\u003c/div>\u003c/div>\u003c/sc-for>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"cw-two\" style=\"margin-top:56px\">\n  \u003cdiv style=\"grid-column:1/-1;padding:clamp(24px,3vw,40px) clamp(8px,2.5vw,32px) 8px\">\u003cdiv style=\"font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-text)\">Who We Work With\u003c/div>\u003c/div>\n  \u003csc-for list=\"{{ who }}\" as=\"w\" hint-placeholder-count=\"2\">\u003cdiv class=\"cw-rv\" style=\"background:{{ w.bg }};color:#fff;border-radius:28px;padding:clamp(24px,3vw,36px);min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:28px\">\u003cb style=\"font:800 clamp(28px,3vw,38px)/1.05 'Bricolage Grotesque';letter-spacing:-0.03em\">{{ w.t }}\u003c/b>\u003cspan style=\"font-size:18px;line-height:1.5;max-width:40ch\">{{ w.d }}\u003c/span>\u003c/div>\u003c/sc-for>\n\u003c/section>\n\n\u003csection style=\"margin-top:64px;background:#1878a4;color:#fff;border-radius:32px;padding:clamp(32px,5vw,56px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:24px 32px\">\n  \u003ch2 style=\"margin:0;font:800 clamp(30px,4vw,50px)/1.02 'Bricolage Grotesque';letter-spacing:-0.035em;max-width:16ch\">Have a complex technology challenge?\u003c/h2>\n  \u003ca class=\"cw-btn cw-btn-inverse cw-btn-lg\" href=\"Codeworks%20Contact.dc.html\">Talk to Us \u003cspan class=\"arr\">→\u003c/span>\u003c/a>\n\u003c/section>\n\u003cdc-import name=\"CW Footer\" hint-size=\"100%,64px\">\u003c/dc-import>\n\u003c/div>\n\u003c/div>\n\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script>\nclass Component extends DCLogic {\n  renderVals() {\n    const tint = i => i % 2 ? { bg: 'var(--tint-green)', fg: 'var(--green-text)' } : { bg: 'var(--tint-blue)', fg: 'var(--blue-text)' };\n    const mk = a => a.map((x, i) => ({ n: '0' + (i + 1), t: x[0], d: x[1], ...tint(i) }));\n    return {\n      bring: mk([['High availability', 'Systems designed to stay running through failures and upgrades.'], ['Scale', 'Platforms that handle millions of daily critical transactions without failure.'], ['Protocols and integrations', 'The depth to connect with your existing systems, without rip and replace.'], ['Configurable by design', 'Business rules and AI you can change without rebuilding the software.']]),\n      build: mk([['Deterministic and traceable', 'Every rule, calculation and decision can be explained and audited.'], ['Configurable', 'Software that evolves with your policies and regulations.'], ['Non-invasive', 'We work alongside your current systems.'], ['Human in the loop', \"AI supports your teams' decisions; it does not replace them.\"]]),\n      who: [{ t: 'Financial institutions', d: 'Banks, NBFCs and lenders improving lending, credit, subvention and settlement operations.', bg: '#1878a4' }, { t: 'Businesses in transformation', d: 'Organisations simplifying complex operations and modernising critical systems.', bg: '#4d8230' }]\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Codeworks Products.dc.html":"\u003c!DOCTYPE html>\n\u003chtml>\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>body{margin:0;background:var(--bg)}:focus-visible{outline:2px solid #1878a4;outline-offset:2px}a{color:var(--blue-text)}a:hover{color:var(--blue-ink)}\n:root{color-scheme:light;--cw-blue:#1878a4;--cw-blue-600:#125f82;--cw-blue-700:#0b4a66;--cw-green:#5c903c;--cw-green-600:#4d8230;--cw-green-700:#3d6522;\n--bg:#f1f6f8;--surface:#ffffff;--surface-2:#f5f9fb;--surface-3:#f3f8fa;--hover:#eef4f7;\n--ink:#0d1f28;--ink-2:#485c65;--ink-3:#33474f;--ink-4:#5a6d76;\n--line:#d4e1e7;--line-2:#e3ecf0;--line-3:#c3d6df;--line-4:#b9c8cf;\n--blue-text:#0b5577;--blue-ink:#1878a4;--green-text:#3d6522;\n--tint-blue:#e0eef5;--tint-green:#e3eed9;--tint-band:#e7f0f4;--tab-bg:#e2ebf0;--input:#f7fafb;\n--ink-fill:#0d1f28;--ink-fill-text:#ffffff;--ink-fill-hover:#1c3541;\n--deep:#0d1f28;--deep-2:#152f3b;\n--warn-bg:#f6dfa8;--warn-fg:#5c3f00;--flag-bg:#f3c4bc;--flag-fg:#7a1f12;--ok-bg:#cfe5bd;--ok-fg:#2f5219;--roi-blue:#e0eef5;--roi-green:#e6f0dc;\n--glass:rgba(255,255,255,.8);--glass-2:rgba(255,255,255,.93);--glass-line:rgba(207,221,228,.9);--back:rgba(255,255,255,.55);}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){color-scheme:dark;\n--bg:#09151b;--surface:#111f27;--surface-2:#15262f;--surface-3:#0d1a21;--hover:#1b2f39;\n--ink:#e8f1f5;--ink-2:#a9bdc6;--ink-3:#c1d0d7;--ink-4:#8fa4ae;\n--line:#26393f;--line-2:#1e303a;--line-3:#33505c;--line-4:#3c5967;\n--blue-text:#86cdf0;--blue-ink:#5cb7e4;--green-text:#a6d982;\n--tint-blue:#15303d;--tint-green:#1b3020;--tint-band:#0d202a;--tab-bg:#17292f;--input:#0c1920;\n--ink-fill:#e8f1f5;--ink-fill-text:#0d1f28;--ink-fill-hover:#ffffff;\n--deep:#0f232d;--deep-2:#183542;\n--warn-bg:#3b3011;--warn-fg:#f3d47e;--flag-bg:#432019;--flag-fg:#f6b5a8;--ok-bg:#1c3a1e;--ok-fg:#b7e39b;--roi-blue:#15303d;--roi-green:#1b3020;\n--glass:rgba(17,31,39,.78);--glass-2:rgba(17,31,39,.93);--glass-line:rgba(60,89,103,.55);--back:rgba(17,31,39,.55);}}\n:root[data-theme=\"dark\"]{color-scheme:dark;\n--bg:#09151b;--surface:#111f27;--surface-2:#15262f;--surface-3:#0d1a21;--hover:#1b2f39;\n--ink:#e8f1f5;--ink-2:#a9bdc6;--ink-3:#c1d0d7;--ink-4:#8fa4ae;\n--line:#26393f;--line-2:#1e303a;--line-3:#33505c;--line-4:#3c5967;\n--blue-text:#86cdf0;--blue-ink:#5cb7e4;--green-text:#a6d982;\n--tint-blue:#15303d;--tint-green:#1b3020;--tint-band:#0d202a;--tab-bg:#17292f;--input:#0c1920;\n--ink-fill:#e8f1f5;--ink-fill-text:#0d1f28;--ink-fill-hover:#ffffff;\n--deep:#0f232d;--deep-2:#183542;\n--warn-bg:#3b3011;--warn-fg:#f3d47e;--flag-bg:#432019;--flag-fg:#f6b5a8;--ok-bg:#1c3a1e;--ok-fg:#b7e39b;--roi-blue:#15303d;--roi-green:#1b3020;\n--glass:rgba(17,31,39,.78);--glass-2:rgba(17,31,39,.93);--glass-line:rgba(60,89,103,.55);--back:rgba(17,31,39,.55);}\n:root[data-theme=\"light\"]{color-scheme:light}\n@keyframes cw-pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}\n@keyframes cw-pulse{0%{box-shadow:0 0 0 0 rgba(24,120,164,.5)}70%,100%{box-shadow:0 0 0 7px rgba(24,120,164,0)}}\n@keyframes cw-dash{to{background-position:12px 0}}\n@keyframes cw-dashv{to{background-position:0 12px}}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}\n\n/* buttons: primary = filled, secondary = outlined, tertiary = text + arrow */\n.cw-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:99px;border:1.5px solid transparent;font:700 16px/1 'DM Sans',sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;box-sizing:border-box;transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s,transform .2s}\n.cw-btn .arr,.cw-tile .arr{display:inline-block;transition:transform .2s}\n.cw-btn:hover .arr,.cw-tile:hover .arr{transform:translateX(5px)}\n.cw-btn:active{transform:translateY(1px)}\n.cw-btn-lg{min-height:60px;padding:0 32px;font-size:17px}\n.cw-btn-sm{min-height:44px;padding:0 22px;font-size:15px}\n.cw-btn-primary,.cw-btn-blue{background:var(--cw-blue);color:#fff}\n.cw-btn-primary:hover,.cw-btn-blue:hover{background:var(--cw-blue-600);color:#fff;box-shadow:0 12px 24px -12px rgba(24,120,164,.8)}\n.cw-btn-green{background:var(--cw-green-600);color:#fff}\n.cw-btn-green:hover{background:var(--cw-green-700);color:#fff;box-shadow:0 12px 24px -12px rgba(77,130,48,.8)}\n.cw-btn-ink{background:var(--ink-fill);color:var(--ink-fill-text)}\n.cw-btn-ink:hover{background:var(--ink-fill-hover);color:var(--ink-fill-text)}\n.cw-btn-secondary{border-color:var(--ink);color:var(--ink);background:transparent}\n.cw-btn-secondary:hover{border-color:var(--blue-ink);color:var(--blue-text);background:var(--surface)}\n.cw-btn-inverse{background:#fff;color:var(--cw-blue-700)}\n.cw-btn-inverse:hover{background:#e6f1f6;color:var(--cw-blue-700);box-shadow:0 12px 24px -12px rgba(0,0,0,.35)}\n.cw-tile{flex:1 1 320px;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:96px;padding:0 32px;border-radius:28px;border:1px solid transparent;font:800 28px 'Bricolage Grotesque',sans-serif;letter-spacing:-.01em;text-decoration:none;transition:background-color .2s,border-color .2s,color .2s,transform .2s,box-shadow .2s}\n.cw-tile:hover{transform:translateY(-2px)}\n.cw-tile-blue{background:var(--cw-blue);color:#fff}\n.cw-tile-blue:hover{background:var(--cw-blue-600);color:#fff;box-shadow:0 20px 36px -20px rgba(24,120,164,.9)}\n.cw-tile-green{background:var(--cw-green-600);color:#fff}\n.cw-tile-green:hover{background:var(--cw-green-700);color:#fff;box-shadow:0 20px 36px -20px rgba(77,130,48,.9)}\n.cw-tile-out{background:var(--surface);border-color:var(--line);color:var(--ink)}\n.cw-tile-out.to-blue:hover{border-color:var(--cw-blue);color:var(--blue-text);background:var(--surface)}\n.cw-tile-out.to-green:hover{border-color:var(--cw-green-600);color:var(--green-text);background:var(--surface)}\n\n/* header */\n.cw-hdr{display:flex;align-items:center;gap:12px 20px;padding:10px 10px 10px 28px;min-height:68px;box-sizing:border-box;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border:1px solid var(--glass-line);box-shadow:0 1px 2px rgba(13,42,58,.04);transition:box-shadow .25s,background-color .25s}\n.cw-hdr.sc{background:var(--glass-2);box-shadow:0 16px 36px -16px rgba(13,42,58,.3)}\n.cw-nav{margin-left:auto;display:flex;align-items:center;gap:2px;font-size:clamp(13.5px,1.3vw,15px);font-weight:500;white-space:nowrap}\n.cw-navi{position:relative;display:inline-flex;align-items:center;min-height:42px;border-radius:99px;color:var(--ink-3);text-decoration:none;transition:background-color .2s,color .2s}\na.cw-navi{padding:0 clamp(10px,1.2vw,15px)}\n.cw-navgrp>a{display:inline-flex;align-items:center;min-height:42px;padding:0 0 0 clamp(10px,1.2vw,15px);color:inherit;text-decoration:none}\n.cw-navgrp>a:hover{color:inherit}\n.cw-navi:hover{background:var(--hover);color:var(--blue-text)}\n.cw-navi.on{background:var(--tint-blue);color:var(--blue-text);font-weight:700}\n.cw-chev{display:inline-grid;place-items:center;width:32px;height:42px;padding:0 8px 0 2px;background:none;border:0;color:inherit;cursor:pointer;border-radius:0 99px 99px 0;box-sizing:border-box}\n.cw-chev svg{transition:transform .2s}\n.cw-chev.open svg{transform:rotate(180deg)}\n.cw-dd{position:relative}\n.cw-menu-wrap{position:absolute;top:100%;padding-top:10px;z-index:60}\n.cw-menu{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:0 26px 50px -18px rgba(13,42,58,.32),0 2px 6px rgba(13,42,58,.06);animation:cw-pop .18s ease-out;transform-origin:top left}\n.cw-mi{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:500;transition:background-color .15s,color .15s}\n.cw-mi:hover{background:var(--hover);color:var(--ink)}\n.cw-mi.on{background:var(--tint-blue)}\n.cw-mi .arr{margin-left:auto;color:var(--ink-4);transition:transform .2s,color .2s}\n.cw-mi:hover .arr{color:var(--blue-ink);transform:translateX(4px)}\n.cw-sw{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#fff;font:800 18px 'Bricolage Grotesque',sans-serif}\n.cw-mt{display:flex;flex-direction:column;gap:2px;min-width:0}\n.cw-mt b{font-size:15.5px;font-weight:700}\n.cw-mt small{font-size:13.5px;color:var(--ink-2);line-height:1.35;white-space:normal;font-weight:400}\n.cw-mi-all{margin-top:6px;padding-top:14px;border-top:1px solid var(--line-2);border-radius:0 0 14px 14px}\n.cw-burger{margin-left:auto;width:46px;height:46px;border-radius:50%;border:1px solid var(--line-3);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:border-color .2s,color .2s}\n.cw-burger:hover{border-color:var(--cw-blue);color:var(--blue-text)}\n.cw-mnav a.cw-ml{display:flex;align-items:center;min-height:44px;border-bottom:1px solid var(--line-2);color:var(--ink);text-decoration:none}\n.cw-mnav a.cw-ml:hover{color:var(--cw-blue-700)}\n\n/* home hero: app window */\n.cw-stage{position:relative;padding:0 0 30px}\n.cw-glow{position:absolute;inset:-56px -40px -20px -48px;background:linear-gradient(120deg,rgba(24,120,164,.2),rgba(92,144,60,.18));-webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);z-index:0;pointer-events:none}\n.cw-back{position:absolute;left:18px;right:-18px;top:18px;bottom:48px;border-radius:22px;background:var(--back);border:1px solid var(--line);z-index:0}\n.cw-win{padding-bottom:34px;position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 1px 0 rgba(13,42,58,.03),0 34px 60px -24px rgba(13,42,58,.32),0 12px 24px -12px rgba(13,42,58,.12)}\n.cw-bar{display:flex;align-items:center;gap:14px;padding:13px 18px;background:var(--surface-2);border-bottom:1px solid var(--line-2)}\n.cw-dots{display:flex;gap:7px;flex:none}\n.cw-dots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}\n.cw-wt{font-size:13px;font-weight:500;color:var(--ink-2);min-width:0}\n.cw-seg{display:flex;gap:5px;padding:18px 22px 6px}\n.cw-seg i{flex:1;height:5px;border-radius:5px;background:var(--line)}\n.cw-seg i.done{background:var(--cw-green-600)}.cw-seg i.run{background:var(--cw-blue)}.cw-seg i.ready{background:var(--cw-green)}\n.cw-steps{padding:4px 22px 6px}\n.cw-step{position:relative;display:flex;align-items:center;gap:14px;padding:9px 0;font-size:16px;font-weight:500}\n.cw-step:not(:last-child)::after{content:\"\";position:absolute;left:15px;top:calc(100% - 9px);height:18px;width:2px;background:var(--line-2)}\n.cw-step>span:nth-child(2){flex:1;min-width:0}\n.cw-node{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:700;border:1.5px solid var(--line-3);color:var(--ink-4);background:var(--surface);box-sizing:border-box}\n.cw-node.done{background:var(--cw-green-600);border-color:var(--cw-green-600);color:#fff}\n.cw-node.run{border-color:var(--cw-blue);color:var(--cw-blue-700);background:var(--tint-blue)}\n.cw-node.ready{border-color:var(--cw-green-600);color:var(--cw-green-700);background:var(--tint-green)}\n.cw-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:none;white-space:nowrap}\n.cw-pill i{width:7px;height:7px;border-radius:50%;background:currentColor}\n.cw-pill.done,.cw-pill.ready{background:var(--tint-green);color:var(--green-text)}\n.cw-pill.run{background:var(--tint-blue);color:var(--blue-text)}\n.cw-pill.run i{background:var(--cw-blue);animation:cw-pulse 1.6s ease-out infinite}\n.cw-pill.queue{background:var(--hover);color:var(--ink-4)}\n.cw-risks{margin:8px 14px 14px;padding:8px;border-radius:16px;background:var(--surface-3);display:grid;gap:6px}\n.cw-risk{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 14px}\n.cw-tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;flex:none}\n.cw-float{position:absolute;left:-40px;bottom:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;width:min(390px,100%);box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 16px;font-size:14.5px;box-shadow:0 22px 40px -16px rgba(13,42,58,.38),0 4px 10px rgba(13,42,58,.06)}\n@media (max-width:1180px){.cw-win{padding-bottom:0}.cw-float{position:relative;left:0;margin-top:12px;width:100%}.cw-back{display:none}.cw-stage{padding-bottom:0}}\n\n/* home product tiles + trust row */\n.cw-prod{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-height:176px;padding:30px 32px;border-radius:28px;color:#fff;text-decoration:none;transition:transform .25s,box-shadow .25s}\n.cw-prod::after{content:\"\";position:absolute;right:-70px;bottom:-90px;width:270px;height:270px;border-radius:50%;border:38px solid rgba(255,255,255,.07);pointer-events:none;transition:transform .5s}\n.cw-prod>*{position:relative;z-index:1}\n.cw-prod:hover{transform:translateY(-3px); ht:2px solid var(--line-3);transform:translateY(-50%) rotate(45deg);transition:border-color .3s}\n.cw-conn.done{background:var(--cw-blue)}\n.cw-conn.done::after,.cw-conn.flow::after{border-color:var(--cw-blue)}\n.cw-conn.flow{background:repeating-linear-gradient(90deg,var(--cw-blue) 0 6px,transparent 6px 12px);background-size:12px 2px;animation:cw-dash .7s linear infinite}\n.cw-detail{position:relative;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,3vw,32px) clamp(72px,7vw,88px) clamp(20px,3vw,32px) clamp(20px,3vw,32px)}\n.cw-detail-in{display:grid}\n.cw-detail-in>div{grid-area:1/1;display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,4vw,48px);align-items:center;transition:opacity .45s ease,visibility .45s}\n.cw-pp{position:absolute;top:14px;right:14px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:border-color .2s,color .2s,background-color .2s}\n.cw-pp:hover{border-color:var(--cw-blue);color:var(--blue-text);background:var(--surface)}\n@media (max-width:899px){.cw-flow{grid-template-columns:1fr}.cw-conn{width:2px;height:30px;justify-self:center}.cw-conn::after{right:auto;left:50%;top:auto;bottom:0;transform:translateX(-50%) rotate(135deg)}.cw-conn.flow{background:repeating-linear-gradient(180deg,var(--cw-blue) 0 6px,transparent 6px 12px);background-size:2px 12px;animation:cw-dashv .7s linear infinite}.cw-nb{min-height:0}.cw-detail{padding-right:clamp(20px,3vw,32px);padding-top:72px}.cw-detail-in>div{grid-template-columns:1fr}}\n\n/* spacing scale: 8 12 16 24 32 48 64 96 128 */\n:root{--s1:8px;--s2:12px;--s3:16px;--s4:24px;--s5:32px;--s6:48px;--s7:64px;--s8:96px;--s9:128px}\n\n/* layout variety */\n.cw-split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:32px clamp(32px,5vw,72px);align-items:start}\n.cw-split2{display:grid;grid-template-columns: ));gap:16px\">\n  \u003csc-for list=\"{{ prods }}\" as=\"p\" hint-placeholder-count=\"2\">\n    \u003carticle class=\"cw-rv\" style=\"background:var(--surface);border:1px solid var(--line);border-radius:32px;overflow:hidden;display:flex;flex-direction:column\">\n      \u003cdiv style=\"background:{{ p.bg }};color:#fff;padding:clamp(28px,3.4vw,44px);min-height:clamp(180px,17vw,220px);display:flex;flex-direction:column;justify-content:space-between;gap:24px\">\n        \u003cspan style=\"font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase\">{{ p.kicker }}\u003c/span>\n        \u003cdiv>\u003cb style=\"display:block;font:700 clamp(44px,5vw,64px)/1 'Bricolage Grotesque';letter-spacing:-0.04em\">{{ p.name }}\u003c/b>\u003cp style=\"margin:14px 0 0;font-size:clamp(17px,1.5vw,19px);line-height:1.4;max-width:36ch\">{{ p.sub }}\u003c/p>\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"padding:clamp(24px,3vw,40px);display:flex;flex-direction:column;gap:28px;flex:1\">\n        \u003cdiv>\u003csc-for list=\"{{ p.points }}\" as=\"pt\" hint-placeholder-count=\"4\">\u003cdiv style=\"display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line-2);font-size:17px;font-weight:500\">\u003cspan style=\"width:8px;height:8px;border-radius:50%;background:{{ p.bg }};flex:none\">\u003c/span>{{ pt }}\u003c/div>\u003c/sc-for>\u003c/div>\n        \u003cdiv style=\"background:{{ p.tint }};border-radius:20px;padding:18px 22px\">\u003cdiv style=\"font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:{{ p.tc }}\">ROI Impact\u003c/div>\u003cdiv style=\"margin-top:6px;font:700 20px/1.3 'Bricolage Grotesque';letter-spacing:-0.01em\">{{ p.roi }}\u003c/div>\u003c/div>\n        \u003ca class=\"cw-btn cw-btn-lg {{ p.btnCls }}\" href=\"{{ p.href }}\" style=\"margin-top:auto;align-self:flex-start\">{{ p.cta }} \u003cspan class=\"arr\">→\u003c/span>\u003c/a>\n      \u003c/div>\n    \u003c/article>\n  \u003c/sc-for>\n\u003c/section>\n\u003cdc-import name=\"CW Footer\" hint-size=\"100%,64px\">\u003c/dc-import>\n\u003c/div>\n\u003c/div>\n\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script>\nclass Component extends DCLogic {\n  renderVals() {\n    return { prods: [\n      { kicker: 'AI-Powered Intelligence Layer', name: 'Drishti.ai', sub: 'AI Credit Assessment & Investigation', points: ['Multi-agent support', 'Inconsistency & risk detection', 'Intelligent Copilot', 'Non-invasive deployment layer'], roi: 'Cuts credit investigation turnaround time by 60%.', cta: 'Explore Drishti.ai', href: 'Drishti%20Product.dc.html', bg: '#1878a4', btnCls: 'cw-btn-blue', tint: 'var(--roi-blue)', tc: 'var(--blue-text)' },\n      { kicker: 'Automated Settlement Engine', name: 'Spectra', sub: 'Subvention Processing Engine for Claims Tracing, Reconciliation and Audit', points: ['Automated claim tracing & validation', 'Rule-based calculation engines', 'Complete transaction traceability', 'Automated multi-party reconciliation'], roi: 'Eliminates audit leaks and manual settlement delays.', cta: 'Explore Spectra', href: 'Spectra%20Product.dc.html', bg: '#4d8230', btnCls: 'cw-btn-green', tint: 'var(--roi-green)', tc: 'var(--green-text)' }\n    ] };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Drishti Product.dc.html":"\u003c!DOCTYPE html>\n\u003chtml>\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>body{margin:0;background:var(--bg)}:focus-visible{outline:2px solid #1878a4;outline-offset:2px}a{color:var(--blue-text)}a:hover{color:var(--blue-ink)}\n:root{color-scheme:light;--cw-blue:#1878a4;--cw-blue-600:#125f82;--cw-blue-700:#0b4a66;--cw-green:#5c903c;--cw-green-600:#4d8230;--cw-green-700:#3d6522;\n--bg:#f1f6f8;--surface:#ffffff;--surface-2:#f5f9fb;--surface-3:#f3f8fa;--hover:#eef4f7;\n--ink:#0d1f28;--ink-2:#485c65;--ink-3:#33474f;--ink-4:#5a6d76;\n--line:#d4e1e7;--line-2:#e3ecf0;--line-3:#c3d6df;--line-4:#b9c8cf;\n--blue-text:#0b5577;--blue-ink:#1878a4;--green-text:#3d6522;\n--tint-blue:#e0eef5;--tint-green:#e3eed9;--tint-band:#e7f0f4;--tab-bg:#e2ebf0;--input:#f7fafb;\n--ink-fill:#0d1f28;--ink-fill-text:#ffffff;--ink-fill-hover:#1c3541;\n--deep:#0d1f28;--deep-2:#152f3b;\n--warn-bg:#f6dfa8;--warn-fg:#5c3f00;--flag-bg:#f3c4bc;--flag-fg:#7a1f12;--ok-bg:#cfe5bd;--ok-fg:#2f5219;--roi-blue:#e0eef5;--roi-green:#e6f0dc;\n--glass:rgba(255,255,255,.8);--glass-2:rgba(255,255,255,.93);--glass-line:rgba(207,221,228,.9);--back:rgba(255,255,255,.55);}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){color-scheme:dark;\n--bg:#09151b;--surface:#111f27;--surface-2:#15262f;--surface-3:#0d1a21;--hover:#1b2f39;\n--ink:#e8f1f5;--ink-2:#a9bdc6;--ink-3:#c1d0d7;--ink-4:#8fa4ae;\n--line:#26393f;--line-2:#1e303a;--line-3:#33505c;--line-4:#3c5967;\n--blue-text:#86cdf0;--blue-ink:#5cb7e4;--green-text:#a6d982;\n--tint-blue:#15303d;--tint-green:#1b3020;--tint-band:#0d202a;--tab-bg:#17292f;--input:#0c1920;\n--ink-fill:#e8f1f5;--ink-fill-text:#0d1f28;--ink-fill-hover:#ffffff;\n--deep:#0f232d;--deep-2:#183542;\n--warn-bg:#3b3011;--warn-fg:#f3d47e;--flag-bg:#432019;--flag-fg:#f6b5a8;--ok-bg:#1c3a1e;--ok-fg:#b7e39b;--roi-blue:#15303d;--roi-green:#1b3020;\n--glass:rgba(17,31,39,.78);--glass-2:rgba(17,31,39,.93);--glass-line:rgba(60,89,103,.55);--back:rgba(17,31,39,.55);}}\n:root[data-theme=\"dark\"]{color-scheme:dark;\n--bg:#09151b;--surface:#111f27;--surface-2:#15262f;--surface-3:#0d1a21;--hover:#1b2f39;\n--ink:#e8f1f5;--ink-2:#a9bdc6;--ink-3:#c1d0d7;--ink-4:#8fa4ae;\n--line:#26393f;--line-2:#1e303a;--line-3:#33505c;--line-4:#3c5967;\n--blue-text:#86cdf0;--blue-ink:#5cb7e4;--green-text:#a6d982;\n--tint-blue:#15303d;--tint-green:#1b3020;--tint-band:#0d202a;--tab-bg:#17292f;--input:#0c1920;\n--ink-fill:#e8f1f5;--ink-fill-text:#0d1f28;--ink-fill-hover:#ffffff;\n--deep:#0f232d;--deep-2:#183542;\n--warn-bg:#3b3011;--warn-fg:#f3d47e;--flag-bg:#432019;--flag-fg:#f6b5a8;--ok-bg:#1c3a1e;--ok-fg:#b7e39b;--roi-blue:#15303d;--roi-green:#1b3020;\n--glass:rgba(17,31,39,.78);--glass-2:rgba(17,31,39,.93);--glass-line:rgba(60,89,103,.55);--back:rgba(17,31,39,.55);}\n:root[data-theme=\"light\"]{color-scheme:light}\n@keyframes cw-pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}\n@keyframes cw-pulse{0%{box-shadow:0 0 0 0 rgba(24,120,164,.5)}70%,100%{box-shadow:0 0 0 7px rgba(24,120,164,0)}}\n@keyframes cw-dash{to{background-position:12px 0}}\n@keyframes cw-dashv{to{background-position:0 12px}}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}\n\n/* buttons: primary = filled, secondary = outlined, tertiary = text + arrow */\n.cw-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:99px;border:1.5px solid transparent;font:700 16px/1 'DM Sans',sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;box-sizing:border-box;transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s,transform .2s}\n.cw-btn .arr,.cw-tile .arr{display:inline-block;transition:transform .2s}\n.cw-btn:hover .arr,.cw-tile:hover .arr{transform:translateX(5px)}\n.cw-btn:active{transform:translateY(1px)}\n.cw-btn-lg{min-height:60px;padding:0 32px;font-size:17px}\n.cw-btn-sm{min-height:44px;padding:0 22px;font-size:15px}\n.cw-btn-primary,.cw-btn-blue{background:var(--cw-blue);color:#fff}\n.cw-btn-primary:hover,.cw-btn-blue:hover{background:var(--cw-blue-600);color:#fff;box-shadow:0 12px 24px -12px rgba(24,120,164,.8)}\n.cw-btn-green{background:var(--cw-green-600);color:#fff}\n.cw-btn-green:hover{background:var(--cw-green-700);color:#fff;box-shadow:0 12px 24px -12px rgba(77,130,48,.8)}\n.cw-btn-ink{background:var(--ink-fill);color:var(--ink-fill-text)}\n.cw-btn-ink:hover{background:var(--ink-fill-hover);color:var(--ink-fill-text)}\n.cw-btn-secondary{border-color:var(--ink);color:var(--ink);background:transparent}\n.cw-btn-secondary:hover{border-color:var(--blue-ink);color:var(--blue-text);background:var(--surface)}\n.cw-btn-inverse{background:#fff;color:var(--cw-blue-700)}\n.cw-btn-inverse:hover{background:#e6f1f6;color:var(--cw-blue-700);box-shadow:0 12px 24px -12px rgba(0,0,0,.35)}\n.cw-tile{flex:1 1 320px;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:96px;padding:0 32px;border-radius:28px;border:1px solid transparent;font:800 28px 'Bricolage Grotesque',sans-serif;letter-spacing:-.01em;text-decoration:none;transition:background-color .2s,border-color .2s,color .2s,transform .2s,box-shadow .2s}\n.cw-tile:hover{transform:translateY(-2px)}\n.cw-tile-blue{background:var(--cw-blue);color:#fff}\n.cw-tile-blue:hover{background:var(--cw-blue-600);color:#fff;box-shadow:0 20px 36px -20px rgba(24,120,164,.9)}\n.cw-tile-green{background:var(--cw-green-600);color:#fff}\n.cw-tile-green:hover{background:var(--cw-green-700);color:#fff;box-shadow:0 20px 36px -20px rgba(77,130,48,.9)}\n.cw-tile-out{background:var(--surface);border-color:var(--line);color:var(--ink)}\n.cw-tile-out.to-blue:hover{border-color:var(--cw-blue);color:var(--blue-text);background:var(--surface)}\n.cw-tile-out.to-green:hover{border-color:var(--cw-green-600);color:var(--green-text);background:var(--surface)}\n\n/* header */\n.cw-hdr{display:flex;align-items:center;gap:12px 20px;padding:10px 10px 10px 28px;min-height:68px;box-sizing:border-box;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border:1px solid var(--glass-line);box-shadow:0 1px 2px rgba(13,42,58,.04);transition:box-shadow .25s,background-color .25s}\n.cw-hdr.sc{background:var(--glass-2);box-shadow:0 16px 36px -16px rgba(13,42,58,.3)}\n.cw-nav{margin-left:auto;display:flex;align-items:center;gap:2px;font-size:clamp(13.5px,1.3vw,15px);font-weight:500;white-space:nowrap}\n.cw-navi{position:relative;display:inline-flex;align-items:center;min-height:42px;border-radius:99px;color:var(--ink-3);text-decoration:none;transition:background-color .2s,color .2s}\na.cw-navi{padding:0 clamp(10px,1.2vw,15px)}\n.cw-navgrp>a{display:inline-flex;align-items:center;min-height:42px;padding:0 0 0 clamp(10px,1.2vw,15px);color:inherit;text-decoration:none}\n.cw-navgrp>a:hover{color:inherit}\n.cw-navi:hover{background:var(--hover);color:var(--blue-text)}\n.cw-navi.on{background:var(--tint-blue);color:var(--blue-text);font-weight:700}\n.cw-chev{display:inline-grid;place-items:center;width:32px;height:42px;padding:0 8px 0 2px;background:none;border:0;color:inherit;cursor:pointer;border-radius:0 99px 99px 0;box-sizing:border-box}\n.cw-chev svg{transition:transform .2s}\n.cw-chev.open svg{transform:rotate(180deg)}\n.cw-dd{position:relative}\n.cw-menu-wrap{position:absolute;top:100%;padding-top:10px;z-index:60}\n.cw-menu{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:0 26px 50px -18px rgba(13,42,58,.32),0 2px 6px rgba(13,42,58,.06);animation:cw-pop .18s ease-out;transform-origin:top left}\n.cw-mi{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:500;transition:background-color .15s,color .15s}\n.cw-mi:hover{background:var(--hover);color:var(--ink)}\n.cw-mi.on{background:var(--tint-blue)}\n.cw-mi .arr{margin-left:auto;color:var(--ink-4);transition:transform .2s,color .2s}\n.cw-mi:hover .arr{color:var(--blue-ink);transform:translateX(4px)}\n.cw-sw{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:#fff;font:800 18px 'Bricolage Grotesque',sans-serif}\n.cw-mt{display:flex;flex-direction:column;gap:2px;min-width:0}\n.cw-mt b{font-size:15.5px;font-weight:700}\n.cw-mt small{font-size:13.5px;color:var(--ink-2);line-height:1.35;white-space:normal;font-weight:400}\n.cw-mi-all{margin-top:6px;padding-top:14px;border-top:1px solid var(--line-2);border-radius:0 0 14px 14px}\n.cw-burger{margin-left:auto;width:46px;height:46px;border-radius:50%;border:1px solid var(--line-3);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:border-color .2s,color .2s}\n.cw-burger:hover{border-color:var(--cw-blue);color:var(--blue-text)}\n.cw-mnav a.cw-ml{display:flex;align-items:center;min-height:44px;border-bottom:1px solid var(--line-2);color:var(--ink);text-decoration:none}\n.cw-mnav a.cw-ml:hover{color:var(--cw-blue-700)}\n\n/* home hero: app window */\n.cw-stage{position:relative;padding:0 0 30px}\n.cw-glow{position:absolute;inset:-56px -40px -20px -48px;background:linear-gradient(120deg,rgba(24,120,164,.2),rgba(92,144,60,.18));-webkit-mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);mask-image:radial-gradient(closest-side,#000 35%,transparent 100%);z-index:0;pointer-events:none}\n.cw-back{position:absolute;left:18px;right:-18px;top:18px;bottom:48px;border-radius:22px;background:var(--back);border:1px solid var(--line);z-index:0}\n.cw-win{padding-bottom:34px;position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 1px 0 rgba(13,42,58,.03),0 34px 60px -24px rgba(13,42,58,.32),0 12px 24px -12px rgba(13,42,58,.12)}\n.cw-bar{display:flex;align-items:center;gap:14px;padding:13px 18px;background:var(--surface-2);border-bottom:1px solid var(--line-2)}\n.cw-dots{display:flex;gap:7px;flex:none}\n.cw-dots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}\n.cw-wt{font-size:13px;font-weight:500;color:var(--ink-2);min-width:0}\n.cw-seg{display:flex;gap:5px;padding:18px 22px 6px}\n.cw-seg i{flex:1;height:5px;border-radius:5px;background:var(--line)}\n.cw-seg i.done{background:var(--cw-green-600)}.cw-seg i.run{background:var(--cw-blue)}.cw-seg i.ready{background:var(--cw-green)}\n.cw-steps{padding:4px 22px 6px}\n.cw-step{position:relative;display:flex;align-items:center;gap:14px;padding:9px 0;font-size:16px;font-weight:500}\n.cw-step:not(:last-child)::after{content:\"\";position:absolute;left:15px;top:calc(100% - 9px);height:18px;width:2px;background:var(--line-2)}\n.cw-step>span:nth-child(2){flex:1;min-width:0}\n.cw-node{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:700;border:1.5px solid var(--line-3);color:var(--ink-4);background:var(--surface);box-sizing:border-box}\n.cw-node.done{background:var(--cw-green-600);border-color:var(--cw-green-600);color:#fff}\n.cw-node.run{border-color:var(--cw-blue);color:var(--cw-blue-700);background:var(--tint-blue)}\n.cw-node.ready{border-color:var(--cw-green-600);color:var(--cw-green-700);background:var(--tint-green)}\n.cw-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:none;white-space:nowrap}\n.cw-pill i{width:7px;height:7px;border-radius:50%;background:currentColor}\n.cw-pill.done,.cw-pill.ready{background:var(--tint-green);color:var(--green-text)}\n.cw-pill.run{background:var(--tint-blue);color:var(--blue-text)}\n.cw-pill.run i{background:var(--cw-blue);animation:cw-pulse 1.6s ease-out infinite}\n.cw-pill.queue{background:var(--hover);color:var(--ink-4)}\n.cw-risks{margin:8px 14px 14px;padding:8px;border-radius:16px;background:var(--surface-3);display:grid;gap:6px}\n.cw-risk{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px;background:var(--surface);border:1px solid va stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 7.5l3 3 6-6.5\">\u003c/path>\u003c/svg>\u003c/span>\u003cspan>{{ h }}\u003c/span>\u003c/div>\u003c/sc-for>\u003c/div>\n      \u003cdiv class=\"cw-roi\" style=\"background:var(--roi-blue);color:var(--blue-text)\">\u003cdiv class=\"k\">ROI Impact\u003c/div>\u003cdiv class=\"v\">Cuts credit investigation turnaround time by \u003cspan class=\"fig\">60%\u003c/span>.\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection style=\"margin-top:56px;padding:0 clamp(8px,2.5vw,32px) 44px\">\n  \u003cdiv role=\"tablist\" class=\"cw-ptabs\" style=\"display:inline-flex;flex-wrap:wrap;gap:6px;background:var(--tab-bg);border-radius:99px;padding:6px\">\n    \u003cbutton role=\"tab\" class=\"cw-tab\" id=\"tab-overview\" aria-selected=\"{{ sel_overview }}\" tabindex=\"{{ ti_overview }}\" onKeyDown=\"{{ tabKey }}\" onClick=\"{{ showOverview }}\" style=\"cursor:pointer;border:0;min-height:44px;padding:0 24px;border-radius:99px;font:700 15px 'DM Sans';background:{{ ovBg }};color:{{ ovFg }}\">Overview\u003c/button>\n    \u003cbutton role=\"tab\" class=\"cw-tab\" id=\"tab-agents\" aria-selected=\"{{ sel_agents }}\" tabindex=\"{{ ti_agents }}\" onKeyDown=\"{{ tabKey }}\" onClick=\"{{ showAgents }}\" style=\"cursor:pointer;border:0;min-height:44px;padding:0 24px;border-radius:99px;font:700 15px 'DM Sans';background:{{ agBg }};color:{{ agFg }}\">Four Intelligent Agents\u003c/button>\n  \u003c/div>\n\n  \u003csc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n    \u003cdiv role=\"tabpanel\" id=\"cw-panel\" aria-labelledby=\"tab-overview\" class=\"cw-split\" style=\"margin-top:40px\">\n      \u003cdiv style=\"font-size:18px;line-height:1.7;color:var(--ink-3);max-width:68ch\">\n        \u003cspan class=\"cw-bar-accent\" style=\"background:#1878a4\">\u003c/span>\n        \u003cp style=\"margin:0 0 20px\">Drishti.ai is an enterprise credit assessment and investigation platform for banks, NBFCs and lending institutions. It enables deeper, technology-led assessment of borrowers across the pre-sanction and post-sanction lifecycle, going beyond conventional credit checks and standard verification processes.\u003c/p>\n        \u003cp style=\"margin:0\">Built on a neuro-symbolic AI architecture, Drishti.ai combines AI reasoning with domain knowledge, business rules and deterministic controls to examine information, identify inconsistencies and surface risk indicators that may require further investigation.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"cw-rcol\">\n        \u003cspan class=\"cw-bar-accent\" style=\"background:#1878a4\">\u003c/span>\n        \u003cp class=\"cw-pull\" style=\"margin:0\">No Rip and Replace of existing systems.\u003c/p>\n        \u003cp style=\"margin:20px 0 0;font-size:18px;line-height:1.7;color:var(--ink-3)\">Drishti.ai brings intelligent investigation and credit assessment into the core of modern lending.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/sc-if>\n\n  \u003csc-if value=\"{{ isAgents }}\" hint-placeholder-val=\"{{ false }}\">\n    \u003cdiv role=\"tabpanel\" id=\"cw-panel\" aria-labelledby=\"tab-agents\" class=\"cw-agrid\" style=\"margin-top:40px\">\n      \u003csc-for list=\"{{ agents }}\" as=\"a\" hint-placeholder-count=\"4\">\u003cbutton type=\"button\" class=\"cw-ag {{ a.cls }}\" aria-pressed=\"{{ a.pressed }}\" onClick=\"{{ a.pick }}\" onMouseEnter=\"{{ a.pick }}\" onFocus=\"{{ a.pick }}\">\u003cspan class=\"k\" style=\"color:{{ a.fg }}\">{{ a.n }}\u003c/span>\u003cspan class=\"t\">{{ a.t }}\u003c/span>\u003cspan class=\"d\">{{ a.d }}\u003c/span>\u003ci class=\"bar\" style=\"background:{{ a.fg }}\">\u003c/i>\u003c/button>\u003c/sc-for>\n    \u003c/div>\n    \u003cdiv style=\"margin-top:28px;font-size:18px;line-height:1.65;color:var(--ink-3);max-width:72ch;display:grid;gap:18px\">\u003cp style=\"margin:0\">Drishti.ai is scalable and configurable, enabling institutions to configure investigation parameters, business rules, workflows and assessment requirements according to their lending products, policies and operating models.\u003c/p>\u003cp style=\"margin:0\">By strengthening verification, investigation and assessment across the credit lifecycle, Drishti.ai helps institutions identify risk earlier, improve assessment quality, reduce manual effort and make better-informed lending decisions.\u003c/p>\u003c/div>\n  \u003c/sc-if>\n\u003c/section>\n\n\u003csection class=\"cw-viz cw-bleed cw-viz-blue\" role=\"img\" aria-label=\"Illustration of the product workflow\">\n \u003cdiv class=\"cw-viz-in cw-rv\">\u003cdiv class=\"cw-vwin\">\u003cdiv class=\"cw-bar\">\u003cspan class=\"cw-dots\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003c/div>\u003cdiv class=\"cw-vrow\">\u003cdiv class=\"cw-vst \">\u003cdiv class=\"cw-vh\">\u003ci class=\"n\" aria-hidden=\"true\">\u003c/i>\u003cb>Document Verification Agent\u003c/b>\u003c/div>\u003cdiv class=\"cw-vb\">\u003cdiv class=\"vdoc\">\u003ci class=\"thumb\">\u003c/i>\u003cspan class=\"col\">\u003cspan class=\"ln w70 \">\u003c/span>\u003cspan class=\"ln w42 \">\u003c/span>\u003c/span>\u003cem class=\"ok\">\u003csvg viewBox=\"0 0 14 14\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 7.5l3 3 6-6.5\">\u003c/path>\u003c/svg>\u003c/em>\u003c/div>\u003cdiv class=\"vdoc\">\u003ci class=\"thumb\">\u003c/i>\u003cspan class=\"col\">\u003cspan class=\"ln w70 \">\u003c/span>\u003cspan class=\"ln w42 \">\u003c/span>\u003c/span>\u003cem class=\"ok\">\u003csvg viewBox=\"0 0 14 14\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M2.5 7.5l3 3 6-6.5\">\u003c/path>\u003c/svg>\u003c/em>\u003c/div>\u003cdiv class=\"vdoc\">\u003ci class=\"thumb\">\u003c/i>\u003cspan class=\"col\">\u003cspan class=\"ln w70 \">\u003c/span>\u003cspan class=\"ln w42 \">\u003c/span>\u003c/span>\u003cem class=\"warn\">!\u003c/em>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"cw-vst \">\u003cdiv class=\"cw-vh\">\u003ci class=\"n\" aria-hidden=\"true\">\u003c/i>\u003cb>Investigation Agent\u003c/b>\u003c/div>\u003cdiv class=\"cw-vb\">\u003csvg class=\"vgraph\" viewBox=\"0 0 220 120\" aria-hidden=\"true\">\u003cg class=\"flowline\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\">\u003cpath d=\"M30 60 L84 26\"/>\u003cpath d=\"M30 60 L84 94\"/>\u003cpath d=\"M84 26 L150 60\"/>\u003cpath d=\"M84 94 L150 60\"/>\u003cpath d=\"M150 60 L196 30\"/>\u003cpath d=\"M84 26 L84 94\" stroke-dasharray=\"3 5\"/>\u003c/g>\u003cg>\u003ccircle cx=\"30\" cy=\"60\" r=\"12\" class=\"nd\"/>\u003ccircle cx=\"84\" cy=\"26\" r=\"12\" class=\"nd\"/>\u003ccircle cx=\"84\" cy=\"94\" r=\"12\" class=\"nd warn\"/>\u003ccircle cx=\"150\" cy=\"60\" r=\"14\" class=\"nd hot\"/>\u003ccircle cx=\"196\" cy=\"30\" r=\"10\" class=\"nd\"/>\u003c/g>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"cw-vst \">\u003cdiv class=\"cw-vh\">\u003ci class=\"n\" aria-hidden=\"true\">\u003c/i>\u003cb>Credit Assessment Report Agent\u003c/b>\u003c/div>\u003cdiv class=\"cw-vb\">\u003cspan class=\"ln w90 \">\u003c/span>\u003cspan class=\"ln w75 \">\u003c/span>\u003cspan class=\"ln w82 \">\u003c/span>\u003cdiv class=\"vbar\">\u003ci style=\"width:82%\">\u003c/i>\u003c/div>\u003cdiv class=\"vbar warn\">\u003ci style=\"width:46%\">\u003c/i>\u003c/div>\u003cdiv class=\"vbar ok\">\u003ci style=\"width:64%\">\u003c/i>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"cw-vst \">\u003cdiv class=\"cw-vh\">\u003ci class=\"n\" aria-hidden=\"true\">\u003c/i>\u003cb>Credit Copilot\u003c/b>\u003c/div>\u003cdiv class=\"cw-vb\">\u003cdiv class=\"bub l\">\u003cspan class=\"ln w80 \">\u003c/span>\u003cspan class=\"ln w50 \">\u003c/span>\u003c/div>\u003cdiv class=\"bub r\">\u003cspan class=\"ln w60 inv\">\u003c/span>\u003c/div>\u003cdiv class=\"bub l\">\u003cspan class=\"ln w70 \">\u003c/span>\u003cspan class=\"ln w34 \">\u003c/span>\u003c/div>\u003cdiv class=\"vinput\">\u003cspan class=\"ln w40\">\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"cw-vprog\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection style=\"margin-top:64px;display:flex;flex-wrap:wrap;gap:12px\">\n  \u003ca class=\"cw-tile cw-tile-blue\" href=\"Codeworks%20Contact.dc.html\">Talk to Us\u003cspan class=\"arr\">→\u003c/span>\u003c/a>\n  \u003ca class=\"cw-tile cw-tile-out to-green\" href=\"Spectra%20Product.dc.html\">Next: Spectra\u003cspan class=\"arr\">→\u003c/span>\u003c/a>\n\u003c/section>\n\u003cdc-import name=\"CW Footer\" hint-size=\"100%,64px\">\u003c/dc-import>\n\u003c/div>\n\u003c/div>\n\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script>\nclass Component extends DCLogic {\n  state = { tab: 'overview', act: 0, auto: true };\n  componentDidMount() { try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) this.setState({ auto: false }); } catch (e) {} this._iv = setInterval(() => { if (this.state.auto && this.state.tab === 'agents') this.setState(s => ({ act: (s.act + 1) % 4 })); }, 2200);  this._h = () => { const k = (location.hash || '').replace('#', ''); if (k === 'agents' || k === 'overview') this.setState({ tab: k }); }; this._h(); window.addEventListener('hashchange', this._h); }\n  componentDidMount2() {}\n  componentWillUnmount() { clearInterval(this._iv); window.removeEventListener('hashchange', this._h); }\n  renderVals() {\n    const o = this.state.tab === 'overview';\n    const A = [['Document Verification Agent', 'Verifies and cross-validates information across borrower documents and supporting evidence, identifying discrepancies, anomalies and missing information.'], ['Investigation Agent', 'Performs deeper investigations across available borrower and business information to uncover relationships, inconsistencies, risk indicators and findings relevant to the credit decision.'], ['Credit Assessment Report Agent', 'Consolidates verification and investigation findings into structured credit assessment reports, providing credit teams with a comprehensive view of the case and supporting evidence.'], ['Credit Copilot', 'Gives credit professionals an intelligent interface to query case information, explore findings and navigate the assessment process, keeping the human decision-maker at the centre of the credit decision.']];\n    return {\n      isOverview: o, isAgents: !o, sel_overview: String(o), sel_agents: String(!o), ti_overview: o ? 0 : -1, ti_agents: o ? -1 : 0,\n      tabKey: e => { const O = ['overview', 'agents'], k = e && e.key, i = Math.max(0, O.indexOf(this.state.tab)); let n = null; if (k === 'ArrowRight') n = O[(i + 1) % O.length]; else if (k === 'ArrowLeft') n = O[(i + O.length - 1) % O.length]; else if (k === 'Home') n = O[0]; else if (k === 'End') n = O[O.length - 1]; if (!n) return; e.preventDefault(); this.setState({ tab: n }); try { history.replaceState(null, '', '#' + n); } catch (x) {} setTimeout(() => { const el = document.getElementById('tab-' + n); if (el) el.focus(); }, 30); },\n      ovBg: o ? 'var(--ink-fill)' : 'transparent', ovFg: o ? 'var(--ink-fill-text)' : 'var(--ink-3)', agBg: !o ? 'var(--ink-fill)' : 'transparent', agFg: !o ? 'var(--ink-fill-text)' : 'var(--ink-3)',\n      showOverview: () => { this.setState({ tab: 'overview' }); try { history.replaceState(null, '', '#overview'); } catch (e) {} },\n      showAgents: () => { this.setState({ tab: 'agents' }); try { history.replaceState(null, '', '#agents'); } catch (e) {} },\n      highlights: ['Multi-agent support', 'Inconsistency & risk detection', 'Intelligent Copilot', 'Non-invasive deployment layer'],\n      agents: A.map((a, i) => ({ cls: (i \u003c this.state.act ? 'done ' : '') + (i === this.state.act ? 'on' : ''), pressed: String(i === this.state.act), pick: () => { if (this.state.act !== i || this.state.auto) this.setState({ act: i, auto: false }); }, n: '0' + (i + 1), t: a[0], d: a[1], bg: i % 2 ? 'var(--tint-green)' : 'var(--tint-blue)', fg: 'var(--blue-text)' }))\n    };\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","Spectra Product.dc.html":"\u003c!DOCTYPE html>\n\u003chtml>\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cscript src=\"./support.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cx-dc>\n\u003chelmet>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>body{margin:0;background:var(--bg)}:focus-visible{outline:2px solid #1878a4;outline-offset:2px}a{color:var(--blue-text)}a:hover{color:var(--blue-ink)}\n:root{color-scheme:light;--cw-blue:#1878a4;--cw-blue-600:#125f82;--cw-blue-700:#0b4a66;--cw-green:#5c903c;--cw-green-600:#4d8230;--cw-green-700:#3d6522;\n--bg:#f1f6f8;--surface:#ffffff;--surface-2:#f5f9fb;--surface-3:#f3f8fa;--hover:#eef4f7;\n--ink:#0d1f28;--ink-2:#485c65;--ink-3:#33474f;--ink-4:#5a6d76;\n--line:#d4e1e7;--line-2:#e3ecf0;--line-3:#c3d6df;--line-4:#b9c8cf;\n--blue-text:#0b5577;--blue-ink:#1878a4;--green-text:#3d6522;\n--tint-blue:#e0eef5;--tint-green:#e3eed9;--tint-band:#e7f0f4;--tab-bg:#e2ebf0;--input:#f7fafb;\n--ink-fill:#0d1f28;--ink-fill-text:#ffffff;--ink-fill-hover:#1c3541;\n--deep:#0d1f28;--deep-2:#152f3b;\n--warn-bg:#f6dfa8;--warn-fg:#5c3f00;--flag-bg:#f3c4bc;--flag-fg:#7a1f12;--ok-bg:#cfe5bd;--ok-fg:#2f5219;--roi-blue:#e0eef5;--roi-green:#e6f0dc;\n--glass:rgba(255,255,255,.8);--glass-2:rgba(255,255,255,.93);--glass-line:rgba(207,221,228,.9);--back:rgba(255,255,255,.55);}\n@media (prefers-color-scheme: n:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}\n\n/* buttons: primary = filled, secondary = outlined, tertiary = text + arrow */\n.cw-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:99px;border:1.5px solid transparent;font:700 16px/1 'DM Sans',sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;box-sizing:border-box;transition:background-color .2s,color .2s,border-color .2s,box-shadow .2s,transform .2s}\n.cw-btn .arr,.cw-tile .arr{display:inline-block;transition:transform .2s}\n.cw-btn:hover .arr,.cw-tile:hover .arr{transform:translateX(5px)}\n.cw-btn:active{transform:translateY(1px)}\n.cw-btn-lg{min-height:60px;padding:0 32px;font-size:17px}\n.cw-btn-sm{min-height:44px;padding:0 22px;font-size:15px}\n.cw-btn-primary,.cw-btn-blue{background:var(--cw-blue);color:#fff}\n.cw-btn-primary:hover,.cw-btn-blue:hover{background:var(--cw-blue-600);color:#fff;box-shadow:0 12px 24px -12px rgba(24,120,164,.8)}\n.cw-btn-green{background:var(--cw-green-600);color:#fff}\n.cw-btn-green:hover{background:var(--cw-green-700);color:#fff;box-shadow:0 12px 24px -12px rgba(77,130,48,.8)}\n.cw-btn-ink{background:var(--ink-fill);color:var(--ink-fill-text)}\n.cw-btn-ink:hover{background:var(--ink-fill-hover);color:var(--ink-fill-text)}\n.cw-btn-secondary{border-color:var(--ink);color:var(--ink);background:transparent}\n.cw-btn-secondary:hover{border-color:var(--blue-ink);color:var(--blue-text);background:var(--surface)}\n.cw-btn-inverse{background:#fff;color:var(--cw-blue-700)}\n.cw-btn-inverse:hover{background:#e6f1f6;color:var(--cw-blue-700);box-shadow:0 12px 24px -12px rgba(0,0,0,.35)}\n.cw-tile{flex:1 1 320px;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:96px;padding:0 32px;border-radius:28px;border:1px solid transparent;font:800 28px 'Bricolage Grotesque'
